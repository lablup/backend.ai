[GLOBAL]
pants_version = "2.32.0"
pythonpath = ["%(buildroot)s/tools/pants-plugins"]
backend_packages = [
    "pants.backend.python",
    "pants.backend.python.typecheck.mypy",
    "pants.backend.shell",
    "pants.backend.experimental.python",
    "pants.backend.experimental.python.lint.ruff.check",
    "pants.backend.experimental.python.lint.ruff.format",
    "pants.backend.experimental.visibility",
    "pants.backend.plugin_development",
    "setupgen",
    "platform_resources",
    "accelerator_wheels",
]
pants_ignore = [
    ".*/",
    "/dist/",
    "/docker/",
    "__pycache__",
    "*~",  # vim swap/backup files
    "/scripts/",
    "/plugins/",
    "/docs/",  # TODO: docs build config
    "/proposals/",
    "*.log",
    "/tools/pants-plugins",
    "/wheelhouse/*/",
    "/wheelhouse/*.whl"
]
build_file_prelude_globs = ["tools/build-macros.py"]
unmatched_build_file_globs = "error"
# A repo-wide goal (`check ::`, `test ::`) holds more than the 4GiB default, so pantsd
# is restarted mid-run. The restart lands in the middle of a write to the machine-wide
# LMDB store at ~/.cache/pants/lmdb_store, which every checkout shares, and a torn
# freelist there stops pants in all of them until the store is rebuilt.
# The value is a resident-size ceiling per daemon, and there is one daemon per
# checkout, so a machine running several at once needs headroom for each.
pantsd_max_memory_usage = "6GiB"

[anonymous-telemetry]
enabled = false

[source]
root_patterns = [
    "/",
    "/src",
    "/tests/scenario",
    "/stubs",
    "/tools/pants-plugins",
]

[subprocess-environment]
# Forward optional GitHub auth tokens used by the `science` binary during scie
# builds. Without these, science calls GitHub anonymously and can hit the per-IP
# rate limit (the response is HTML, which then surfaces as a checksum failure
# with `<!DOCTYPE` in the digest). Set either env var to a GitHub PAT in your
# shell to authenticate scie-jump/ptex/PBS downloads.
env_vars.add = [
    "SCIENCE_AUTH_GITHUB_COM_BEARER",
    "SCIENCE_AUTH_API_GITHUB_COM_BEARER",
]

[test]
extra_env_vars = ["BACKEND_BUILD_ROOT=%(buildroot)s", "HOME"]
attempts_default = 2
timeout_default = 180
# Files sharing a batch_compatibility_tag run in one pytest process, batch_size to 2x batch_size
# per batch. CI shards hold 10-31 files on 4 cores; 5 keeps every shard at 2+ batches.
batch_size = 5

[lint]
# Batch more files per linter invocation to reduce ruff process startup overhead.
# Default is 128; raising it cuts the number of spawned ruff processes ~8x.
batch_size = 1024

[python]
enable_resolves = true
# When changing this main Python version:
# * Update and commit:
#   - Regenerate lockfiles
#   - pyproject.toml: [tool.mypy].python_executable
# * Let other developers do:
#   - Run `pants export` again
#   - Update their local IDE/editor's interpreter path configurations
interpreter_constraints = ["CPython==3.13.7"]
resolver = "uv"
pip_version = "26.2.2"
tailor_pex_binary_targets = false

[python-bootstrap]
search_path = ["<PYENV>"]

[python-infer]
use_rust_parser = true
unowned_dependency_behavior = "error"

# This slows down `generate-lockfiles` severely. Enable only when strictly needed.
# [python-repos]
# indexes = ["https://dist.backend.ai/pypi/simple/", "https://pypi.org/simple/"]
# find_links = ["file://%(buildroot)s/wheelhouse"]

[python.resolves]
python-default = "python.lock"
python-kernel = "python-kernel.lock"
pants-plugins = "tools/pants-plugins.lock"
black = "tools/black.lock"
pytest = "tools/pytest.lock"
coverage-py = "tools/coverage-py.lock"
mypy = "tools/mypy.lock"
towncrier = "tools/towncrier.lock"
setuptools = "tools/setuptools.lock"

[export]
bin = [
    "ruff",
]

# [setup-py-generation]
# first_party_depenency_version_scheme = "exact"

[pex-cli]
# Pin the PEX version to get benefits from a-scie/lift#116.
version = "v2.104.1"
known_versions = [
    "v2.104.1|macos_arm64|09b82471a777606cc1b74af13c3a4c8d09982dfb2d448d5dd0ce5d408ea1035b|5408285",
    "v2.104.1|macos_x86_64|09b82471a777606cc1b74af13c3a4c8d09982dfb2d448d5dd0ce5d408ea1035b|5408285",
    "v2.104.1|linux_arm64|09b82471a777606cc1b74af13c3a4c8d09982dfb2d448d5dd0ce5d408ea1035b|5408285",
    "v2.104.1|linux_x86_64|09b82471a777606cc1b74af13c3a4c8d09982dfb2d448d5dd0ce5d408ea1035b|5408285",
]
# When trying a new pex version, you could find out the hash and size-in-bytes as follows:
# $ curl -s -L https://github.com/pantsbuild/pex/releases/download/v2.28.1/pex | tee >(wc -c) >(shasum -a 256) >/dev/null
# As of PEX v2.18, the GitHub release descriptions include the checksum and size for reference.

[uv]
version = "0.13.4"
known_versions = [
    "0.13.4|macos_arm64|e0b1d4743ce64c55d9f0f4a444afa6b81125680070ee04e853fcd0f6c1ebf8f1|14326193",
    "0.13.4|macos_x86_64|7be2dcd316122f4b3e5a0a7889f6248266c14425374e105ff7dc9779184603a6|17217446",
    "0.13.4|linux_arm64|253a17cadcb659ae77a0fe3b9a2f1c14297528d480c421899e61e64d64f24e8f|17045416",
    "0.13.4|linux_x86_64|28d4385f9f9d1d1c7654d85b3855e0e2615b2f6cc13136a2edff858bbdc16ff1|18450841",
]

[black]
install_from_resolve = "black"

[ruff]
version = "0.14.0"
# take tar.gz files and their checksums from the GitHub release (darwin and linux-musl)
known_versions = [
    "0.14.0|macos_arm64|0b7c193d5c45eda02226720eb75239fabeca995d5a0eb3830fd2973caa3030ec|12364514",
    "0.14.0|macos_x86_64|880ae046b435eb306cd557a7481eed6da463b85f283ba1f2c1e2ad7c139ed6c5|13149751",
    "0.14.0|linux_arm64|34a25398f03e7d32a4ec406c5c841c6e183fa0a96fbdd40b7e7eec1f177b360e|12465179",
    "0.14.0|linux_x86_64|ed6d1b8407a1d228dc332fb19057e86e04a6cd3c2beacdb324ad6ff2a3f9071b|13647531",
]

[pytest]
install_from_resolve = "pytest"
args = ["-v", "--suppress-no-test-exit-code"]
execution_slot_var = "BACKEND_TEST_EXEC_SLOT"

[coverage-py]
install_from_resolve = "coverage-py"
report = ["xml", "console"]

[mypy]
install_from_resolve = "mypy"
config = "pyproject.toml"

[setuptools]
install_from_resolve = "setuptools"
