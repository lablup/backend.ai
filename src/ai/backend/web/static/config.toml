[general]
# Set apiEndpoint only to a Backend.AI Webserver address (the webserver fills it
# with its own origin). A non-empty value disables API sign-in, which needs a
# Manager endpoint; leave it blank to let users type a Manager address for API mode.
apiEndpoint = "[Default API Endpoint. If blank, user input field will be shown.]"
#apiDomainName = ""                     # Domain whose System Settings are read before sign-in. The webserver sets it.
connectionMode = "[Connection mode. Default is API. Currenly supports API and SESSION]"
signupSupport = false                   # Enable/disable signup feature support. Manager plugin is required.
enableWebMCP = true                     # Register WebMCP tools (document.modelContext) so an AI agent in a WebMCP-capable browser can read pages, navigate and fill forms. On when the key is absent; set false to turn them off. Tools never submit or delete anything.
# Every other WebUI setting is edited in Administration > System Settings
# (stored in the manager's app config); keys for them here are ignored.

[wsproxy]
proxyURL = "[Proxy URL]"
#disableCertCheck = false                # If true, skip TLS certificate checks. Desktop: also accepts invalid certificates in the main window without asking; may be set in <userData>/config.toml

[server]
webServerURL = "[Web server website URL. App will use the site instead of local app.]"
                   # Uses websocket proxy in the app

