            lb.setAttribute('x1', x1); lb.setAttribute('y1', y);
            lb.setAttribute('x2', x2); lb.setAttribute('y2', y);
            layerB.appendChild(lb);
            k++;
          }
        }
        // Wire-cube loader: set each edge's dash length so the spiral draw animates.
        var edges = document.querySelectorAll('#splash .splash-cube .edge');
        for (var i = 0; i < edges.length; i++) {
          var L = edges[i].getTotalLength();
          edges[i].style.setProperty('--L', L.toFixed(2));
          edges[i].style.strokeDasharray = L.toFixed(2);
          edges[i].style.strokeDashoffset = L.toFixed(2);
        }
      })();

      if (globalThis.isIE) {
        alert('Internet Explorer is not supported. Please visit with modern browsers.');
        document.getElementById('loading-message').innerText = 'Not supported browser.';
        document.getElementById('loading-message').style.color = 'red';
      }
      if (window.location.hostname !== '127.0.0.1' &&
        !window.location.hostname.endsWith('localhost') &&
        'enableSW' in globalThis &&
        globalThis.enableSW === true) {
        // Service worker routine.
        if ('serviceWorker' in navigator && globalThis.isElectron === false) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js');
          });
        }
      }

      // Splash lifecycle: loading -> (login-backdrop | removed).
      //
      // - window.__enterLoginBackdrop(): called by LoginView when the login
      //   form becomes visible (logged-out). Keeps the weave + corner
      //   metadata as the login screen background, hides only the loader.
      // - window.__dismissSplash(): called by MainLayout when the authenticated
      //   UI is ready (logged-in). Fades out and removes the whole splash so it
      //   can't cover the app (it sits at --bai-z-splash, above page content).
      //
      // A ResizeObserver + timers serve as fallbacks for routes that call
      // neither (e.g. /verify-email, /change-password). Every fallback is
      // gated on the app having actually rendered content — see appHasContent.
      (function () {
        var splash = document.getElementById('splash');
        if (!splash) return;
        var state = 'loading'; // 'loading' | 'backdrop' | 'removed'
        var reactRoot = document.getElementById('react-root');
        var observer = null;
        var fallbackTimer = null;

        function clearFallbacks() {
          if (observer) { observer.disconnect(); observer = null; }
          if (fallbackTimer) { clearTimeout(fallbackTimer); fallbackTimer = null; }
        }

        // "Is the app actually on screen?" — NOT "has React committed?".
        // Astryx's root <Theme> wrapper is `display: contents`, so it adds no
        // box: #react-root has height only once real content renders. The old
        // childList observer fired on that wrapper, i.e. before anything was
        // visible, which is what turned the curtain into a blank screen.
        function appHasContent() {
          return !!reactRoot && reactRoot.getBoundingClientRect().height > 0;
        }

        // Full removal (authenticated UI ready, or fallback).
        function dismiss() {
          if (state === 'removed') return;
          state = 'removed';
          clearFallbacks();
          splash.classList.add('splash-hidden');
          splash.addEventListener('transitionend', function handler(e) {
            if (e.propertyName === 'opacity') {
              splash.removeEventListener('transitionend', handler);
              if (splash.parentNode) splash.remove();
            }
          });
          // Safety net: remove even if transitionend never fires (e.g. prefers-reduced-motion)
          setTimeout(function () { if (splash.parentNode) splash.remove(); }, 1000);
        }

        // Transition to the login backdrop (logged-out login screen).
        function enterLoginBackdrop() {
          if (state !== 'loading') return;
          state = 'backdrop';
          // The backdrop must persist through the whole login flow, so cancel
          // the auto-removal fallbacks.
          clearFallbacks();
          splash.classList.add('splash-backdrop');
        }

        window.__dismissSplash = dismiss;
        window.__enterLoginBackdrop = enterLoginBackdrop;

        // Dev-only (the NODE_ENV shim above is injected by react/vite.config.ts
        // in dev): Backspace on the loading splash reloads straight to the login
        // form. Lives here, not in a module, so it exists before Vite loads the
        // app. Not Esc: browsers treat Esc during a page load as "stop loading".
        if (globalThis.process && globalThis.process.env &&
            globalThis.process.env.NODE_ENV === 'development') {
          window.addEventListener('keydown', function (e) {
            if (e.key !== 'Backspace' || state !== 'loading') return;
            e.preventDefault();
            e.stopImmediatePropagation();
            // INTENTIONAL_LOGOUT_FLAG in react/src/hooks/useLogout.ts. Already
            // set means this load is the reload heading to the form: let it finish.
            var flag = 'backendai_intentional_logout';
            if (sessionStorage.getItem(flag) === '1') return;
            sessionStorage.setItem(flag, '1');
            window.location.reload();
          }, true);
        }

        // Fallback for routes that signal neither (/verify-email,
        // /change-password): dismiss once the app occupies space. A
        // ResizeObserver IS the predicate, so no polling and no forced layout.
        // The 3s delay is the margin that lets LoginView's
        // __enterLoginBackdrop() win this race on the logged-out path.
        if (reactRoot && typeof ResizeObserver === 'function') {
          observer = new ResizeObserver(function () {
            if (state === 'loading' && appHasContent()) {
              clearFallbacks();
              fallbackTimer = setTimeout(dismiss, 3000);
            }
          });
          observer.observe(reactRoot);
        }
        // Ultimate safety net — never tear the curtain down over NOTHING. If
        // React has rendered no content by now the boot is broken or merely
        // slow, and "Loading components…" is a better screen than the blank
        // page this used to reveal; the observer above still dismisses if
        // content lands later.
        setTimeout(function () {
          if (state !== 'backdrop' && appHasContent()) dismiss();
        }, 10000);
      })();
    </script>
</body>

</html>
