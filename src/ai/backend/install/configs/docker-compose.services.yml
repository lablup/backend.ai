# Backend.AI deployment (DOCKER install mode), generated by backendai-install.
# The halfstack definition (PostgreSQL/Redis/etcd) is merged into this file at
# install time. The deployment contract and its rationale: docker/README.md.
name: backendai-services
services:
  manager:
    image: lablup/backend.ai-manager:{{VERSION}}
    network_mode: host
    privileged: true
    depends_on:
      backendai-half-db:
        condition: service_healthy
      backendai-half-redis:
        condition: service_healthy
      backendai-half-etcd:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/machine-id:/etc/machine-id:ro
      - {{BASE_PATH}}/manager.toml:/etc/backend.ai/manager.toml:ro
      # RPC keypair, generated by the image entrypoint at first start
      - {{BASE_PATH}}/fixtures:/app/fixtures
      # plugin-wheel staging: docker exec <svc> pip install /app/wheelhouse/*.whl
      # (rw: the install unpacks the wheels in place)
      - {{BASE_PATH}}/wheelhouse:/app/wheelhouse
    restart: unless-stopped

  # One-off management CLI (`docker compose run manager-cli ...`); the "cli"
  # profile keeps `docker compose up -d` from ever starting it.
  manager-cli:
    image: lablup/backend.ai-manager:{{VERSION}}
    network_mode: host
    working_dir: {{BASE_PATH}}
    profiles: ["cli"]
    command: ["true"]
    volumes:
      - /etc/machine-id:/etc/machine-id:ro
      - {{BASE_PATH}}/manager.toml:/etc/backend.ai/manager.toml:ro
      - {{BASE_PATH}}:{{BASE_PATH}}

  agent:
    image: lablup/backend.ai-agent:{{VERSION}}
    network_mode: host
    privileged: true
    depends_on:
      backendai-half-redis:
        condition: service_healthy
      backendai-half-etcd:
        condition: service_healthy
    pid: host
    # REQUIRED on cgroup v2 hosts: a private cgroup namespace breaks the
    # agent's host-PID -> container-PID translation
    cgroup: host
    # the #gpu# block is enabled when installing with a CUDA accelerator
#gpu#    deploy:
#gpu#      resources:
#gpu#        reservations:
#gpu#          devices:
#gpu#            - driver: nvidia
#gpu#              count: all
#gpu#              capabilities: [gpu]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/machine-id:/etc/machine-id:ro
      - {{BASE_PATH}}/agent.toml:/etc/backend.ai/agent.toml:ro
      # host==container path parity for paths handed to the host Docker daemon
      - /var/lib/backend.ai:/var/lib/backend.ai
      - /tmp/backend.ai:/tmp/backend.ai
      - /vfroot/local:/vfroot/local
      - /tmp/backend-ai-krunner:/tmp/backend-ai-krunner
      # plugin-wheel staging: docker exec <svc> pip install /app/wheelhouse/*.whl
      # (rw: the install unpacks the wheels in place)
      - {{BASE_PATH}}/wheelhouse:/app/wheelhouse
    restart: unless-stopped

  webserver:
    image: lablup/backend.ai-webserver:{{VERSION}}
    networks:
      - half
    depends_on:
      backendai-half-redis:
        condition: service_healthy
    ports:
      - "8090:8090"
    volumes:
      - {{BASE_PATH}}/webserver.conf:/etc/backend.ai/webserver.conf:ro
    restart: unless-stopped

  storage-proxy:
    image: lablup/backend.ai-storage-proxy:{{VERSION}}
    networks:
      - half
    depends_on:
      backendai-half-etcd:
        condition: service_healthy
    # the installing user: PACKAGE-mode file ownership of the vfolder tree
    user: "{{UID}}:{{GID}}"
    environment:
      # the image default ./run is not writable by a non-root user
      - BACKENDAI_PROMETHEUS_DIR=/tmp/backend.ai/run/prometheus
    ports:
      - "6021:6021"
      - "6022:6022"
    volumes:
      - {{BASE_PATH}}/storage-proxy.toml:/etc/backend.ai/storage-proxy.toml:ro
      # vfolder tree (path parity; chowned to the installing user)
      - /vfroot/local:/vfroot/local
      # self-signed TLS material for the manager-facing API
      - {{BASE_PATH}}/configs/storage-proxy:{{BASE_PATH}}/configs/storage-proxy:ro
    restart: unless-stopped

  appproxy-coordinator:
    image: lablup/backend.ai-appproxy-coordinator:{{VERSION}}
    networks:
      - half
    depends_on:
      backendai-half-db:
        condition: service_healthy
      backendai-half-redis:
        condition: service_healthy
    ports:
      - "10200:10200"
    volumes:
      - {{BASE_PATH}}/app-proxy-coordinator.toml:/etc/backend.ai/proxy-coordinator.toml:ro
    restart: unless-stopped

  appproxy-worker:
    image: lablup/backend.ai-appproxy-worker:{{VERSION}}
    networks:
      - half
    depends_on:
      backendai-half-redis:
        condition: service_healthy
    ports:
      - "10201:10201"
      - "10205-10300:10205-10300"
    volumes:
      - {{BASE_PATH}}/app-proxy-worker.toml:/etc/backend.ai/proxy-worker.toml:ro
    restart: unless-stopped

  appproxy-worker-tcp:
    image: lablup/backend.ai-appproxy-worker:{{VERSION}}
    networks:
      - half
    depends_on:
      backendai-half-redis:
        condition: service_healthy
    ports:
      - "10202:10202"
      - "10501-10600:10501-10600"
    volumes:
      - {{BASE_PATH}}/app-proxy-worker-tcp.toml:/etc/backend.ai/proxy-worker.toml:ro
    restart: unless-stopped
