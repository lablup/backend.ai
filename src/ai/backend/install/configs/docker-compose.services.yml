# Backend.AI service containers (DOCKER install mode).
#
# This file is a template: the installer substitutes the install-directory,
# release-version, and uid/gid placeholders, and uncomments the GPU
# device-reservation lines of the agent service when a CUDA accelerator is
# selected (the marker prefix keeps that block a comment otherwise).
#
# Design contract (see docker/README.md for the rationale) — this file follows
# the SAME deployment convention as a hand-written compose deployment: every
# service reads its config from the image's default `/etc/backend.ai/*` path
# via a per-file read-only mount, and runs the image's default command.
#
# - Host networking is granted only where required: the manager and the agent
#   (kernel/RPC ports advertised on host addresses) — plus manager-cli, the
#   installer's own one-off tool, which must reach halfstack at 127.0.0.1.
# - The other services join the halfstack's "half" bridge network with
#   published ports matching the fixed ports of the installer's
#   ServiceConfig; their generated configs address the halfstack and the
#   coordinator by compose service DNS (container-side ports), the manager
#   API via host.docker.internal (webserver only), and their bind addresses
#   are forced to 0.0.0.0 so the published ports work.
# - No service mounts the install directory wholesale. The daemon-visible
#   state lives under fixed system paths mounted with host==container path
#   parity: /var/lib/backend.ai + /tmp/backend.ai (agent) and /vfroot/local
#   (agent + storage-proxy). Only manager-cli — the installer's one-off
#   tool — carries the install-directory mount, for fixture files.
# - The manager exchanges the RPC keypair through {{BASE_PATH}}/fixtures
#   mounted at /app/fixtures, where its entrypoint generates it.
# - The storage-proxy runs as the installing user ({{UID}}:{{GID}}), matching
#   the PACKAGE-mode behavior; the vfolder tree and its self-signed TLS
#   material are owned by that user.
# - The agent additionally needs pid/cgroup host namespaces and the
#   /var/lib/backend.ai/krunner share for kernel-runner bind-mounts.
# - No agent-watcher container ships in this mode; the watcher endpoint in
#   the generated agent config is inert.
# - The installer merges the halfstack definition (PostgreSQL/Redis/etcd +
#   optional observability) INTO this file at generation time, so the whole
#   deployment is ONE compose file and ONE compose project, with depends_on
#   health gating on the halfstack members.
name: backendai-services
services:
  manager:
    image: lablup/backend.ai-manager:{{VERSION}}
    network_mode: host
    privileged: true
    depends_on:
      backendai-half-db:
        condition: service_healthy
      backendai-half-redis:
        condition: service_healthy
      backendai-half-etcd:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/machine-id:/etc/machine-id:ro
      - {{BASE_PATH}}/manager.toml:/etc/backend.ai/manager.toml:ro
      # the image entrypoint generates the RPC keypair here at first start
      - {{BASE_PATH}}/fixtures:/app/fixtures
      # staging dir for extra plugin wheels (e.g. accelerator plugins):
      # install them with `docker exec <svc> pip install /app/wheelhouse/*.whl`
      - {{BASE_PATH}}/wheelhouse:/app/wheelhouse:ro
    restart: unless-stopped

  # Non-privileged twin of the manager used only for one-off management
  # commands via `docker compose run`; its "cli" profile keeps
  # `docker compose up -d` from ever starting it. It carries the base_path
  # parity mount so fixture files under the install directory resolve.
  manager-cli:
    image: lablup/backend.ai-manager:{{VERSION}}
    network_mode: host
    # one-off CLI invocations use install-directory-relative paths
    # (e.g. `mgr generate-rpc-keypair fixtures/manager`)
    working_dir: {{BASE_PATH}}
    profiles: ["cli"]
    command: ["true"]
    volumes:
      - /etc/machine-id:/etc/machine-id:ro
      - {{BASE_PATH}}/manager.toml:/etc/backend.ai/manager.toml:ro
      - {{BASE_PATH}}:{{BASE_PATH}}

  agent:
    image: lablup/backend.ai-agent:{{VERSION}}
    network_mode: host
    privileged: true
    depends_on:
      backendai-half-redis:
        condition: service_healthy
      backendai-half-etcd:
        condition: service_healthy
    pid: host
    # REQUIRED: on cgroup v2 hosts Docker defaults to a private cgroup
    # namespace even for privileged containers, which breaks the agent's
    # host-PID -> container-PID translation.
    cgroup: host
#gpu#    deploy:
#gpu#      resources:
#gpu#        reservations:
#gpu#          devices:
#gpu#            - driver: nvidia
#gpu#              count: all
#gpu#              capabilities: [gpu]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/machine-id:/etc/machine-id:ro
      - {{BASE_PATH}}/agent.toml:/etc/backend.ai/agent.toml:ro
      # path parity (host path == container path) for everything the agent
      # hands to the host Docker daemon — all under fixed system paths, so
      # the install directory itself is never mounted:
      #   /var/lib/backend.ai: scratches, plugin var state, image commits,
      #                        and the krunner share the entrypoint fills
      #   /tmp/backend.ai:     agent<->kernel IPC sockets
      #   /vfroot/local:       vfolder volumes (files created by the
      #                        storage-proxy, bind-mounted into kernels)
      - /var/lib/backend.ai:/var/lib/backend.ai
      - /tmp/backend.ai:/tmp/backend.ai
      - /vfroot/local:/vfroot/local
      # staging dir for extra plugin wheels (e.g. accelerator plugins):
      # install them with `docker exec <svc> pip install /app/wheelhouse/*.whl`
      - {{BASE_PATH}}/wheelhouse:/app/wheelhouse:ro
    restart: unless-stopped

  webserver:
    image: lablup/backend.ai-webserver:{{VERSION}}
    networks:
      - half
    depends_on:
      backendai-half-redis:
        condition: service_healthy
    ports:
      - "8090:8090"  # ServiceConfig.webserver_addr
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - {{BASE_PATH}}/webserver.conf:/etc/backend.ai/webserver.conf:ro
    restart: unless-stopped

  storage-proxy:
    image: lablup/backend.ai-storage-proxy:{{VERSION}}
    networks:
      - half
    depends_on:
      backendai-half-etcd:
        condition: service_healthy
    # the installing user: vfolder files keep the same ownership as in
    # PACKAGE mode (the chown watcher, which needs root, is not used here)
    user: "{{UID}}:{{GID}}"
    environment:
      # the default ./run/prometheus resolves under the root-owned /app,
      # which the non-root user cannot create — use a container-local
      # writable path instead
      - BACKENDAI_PROMETHEUS_DIR=/tmp/backend.ai/run/prometheus
    ports:
      - "6021:6021"  # ServiceConfig.storage_proxy_client_facing_addr
      - "6022:6022"  # ServiceConfig.storage_proxy_manager_facing_addr
    volumes:
      - {{BASE_PATH}}/storage-proxy.toml:/etc/backend.ai/storage-proxy.toml:ro
      # path parity: the vfolder tree it manages becomes kernel bind-mount
      # sources on the host (chowned to the installing user by the
      # installer's root one-off)
      - /vfroot/local:/vfroot/local
      # the self-signed TLS material for the manager-facing API
      - {{BASE_PATH}}/configs/storage-proxy:{{BASE_PATH}}/configs/storage-proxy:ro
    restart: unless-stopped

  appproxy-coordinator:
    image: lablup/backend.ai-appproxy-coordinator:{{VERSION}}
    networks:
      - half
    depends_on:
      backendai-half-db:
        condition: service_healthy
      backendai-half-redis:
        condition: service_healthy
    ports:
      - "10200:10200"  # ServiceConfig.appproxy_coordinator_addr
    volumes:
      - {{BASE_PATH}}/app-proxy-coordinator.toml:/etc/backend.ai/proxy-coordinator.toml:ro
    restart: unless-stopped

  appproxy-worker:
    image: lablup/backend.ai-appproxy-worker:{{VERSION}}
    networks:
      - half
    depends_on:
      backendai-half-redis:
        condition: service_healthy
    ports:
      - "10201:10201"  # ServiceConfig.appproxy_worker_addr
      - "10205-10300:10205-10300"  # [proxy_worker.port_proxy] bind_port_range
    volumes:
      - {{BASE_PATH}}/app-proxy-worker.toml:/etc/backend.ai/proxy-worker.toml:ro
    restart: unless-stopped

  appproxy-worker-tcp:
    image: lablup/backend.ai-appproxy-worker:{{VERSION}}
    networks:
      - half
    depends_on:
      backendai-half-redis:
        condition: service_healthy
    ports:
      - "10202:10202"  # ServiceConfig.appproxy_tcp_worker_addr
      - "10501-10600:10501-10600"  # [proxy_worker.port_proxy] bind_port_range
    volumes:
      - {{BASE_PATH}}/app-proxy-worker-tcp.toml:/etc/backend.ai/proxy-worker.toml:ro
    restart: unless-stopped
