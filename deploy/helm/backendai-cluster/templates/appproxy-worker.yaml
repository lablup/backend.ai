{{- if .Values.appproxyWorker.enabled }}
{{- $w := .Values.appproxyWorker }}
{{- $valkey := .Values.controlPlane.valkey }}
{{- $secretName := required "appproxyWorker.secrets.name (an existing Secret) is required" $w.secrets.name }}
# appproxy worker in the cluster (suggestion-1122 9.2): it reaches session Pods by Pod IP and
# registers with the control plane's coordinator. The config holds no secret: an init container
# fills the @@NAME@@ placeholders from existing Secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: appproxy-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backendai-cluster.labels" . | nindent 4 }}
data:
  app-proxy-worker.toml: |
    [redis]
    addr = { host = {{ (splitList ":" $valkey.addr) | first | quote }}, port = {{ (splitList ":" $valkey.addr) | last }} }
    {{- if $valkey.passwordSecret.name }}
    password = @@VALKEY_PASSWORD@@
    {{- end }}

    [proxy_worker]
    coordinator_endpoint = {{ $w.coordinatorEndpoint | quote }}
    authority = {{ $w.authority | default .Values.cluster.agentId | quote }}
    tls_listen = false
    tls_advertised = false
    frontend_mode = "port"
    protocol = "http"
    accepted_traffics = ["inference", "interactive"]
    api_bind_addr = { host = "0.0.0.0", port = {{ $w.apiPort }} }
    api_advertised_addr = { host = {{ $w.advertisedHost | quote }}, port = {{ $w.apiPort }} }

    [proxy_worker.port_proxy]
    bind_host = "0.0.0.0"
    advertised_host = {{ $w.advertisedHost | quote }}
    bind_port_range = [{{ index $w.portRange 0 }}, {{ index $w.portRange 1 }}]

    [secrets]
    api_secret = @@API_SECRET@@
    jwt_secret = @@JWT_SECRET@@

    [permit_hash]
    secret = @@PERMIT_HASH_SECRET@@

    [logging]
    level = {{ $w.logLevel | quote }}
    drivers = ["console"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appproxy-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backendai-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/name: appproxy-worker
spec:
  # Port mode binds host ports: one worker per node.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: appproxy-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: appproxy-worker
      annotations:
        checksum/config: {{ toJson $w | sha256sum }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with $w.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: config
          image: {{ include "backendai-cluster.image" .Values.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # A JSON string is a valid TOML basic string.
          command:
            - python
            - -c
            - |
              import json, os, re
              text = open("/etc/appproxy-template/app-proxy-worker.toml").read()
              text = re.sub(r"@@(\w+)@@", lambda m: json.dumps(os.environ[m.group(1)]), text)
              with open("/etc/backend.ai/app-proxy-worker.toml", "w") as f:
                  f.write(text)
          env:
            {{- if $valkey.passwordSecret.name }}
            - name: VALKEY_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $valkey.passwordSecret.name }}, key: {{ $valkey.passwordSecret.key }}}}
            {{- end }}
            - name: API_SECRET
              valueFrom: {secretKeyRef: {name: {{ $secretName }}, key: {{ $w.secrets.apiSecretKey }}}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: {{ $secretName }}, key: {{ $w.secrets.jwtSecretKey }}}}
            - name: PERMIT_HASH_SECRET
              valueFrom: {secretKeyRef: {name: {{ $secretName }}, key: {{ $w.secrets.permitHashSecretKey }}}}
          volumeMounts:
            - {name: template, mountPath: /etc/appproxy-template, readOnly: true}
            - {name: config, mountPath: /etc/backend.ai}
      containers:
        - name: worker
          image: {{ include "backendai-cluster.image" .Values.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /tmp
          command: [python, -m, ai.backend.cli, app-proxy-worker, start-server, -f, /etc/backend.ai/app-proxy-worker.toml]
          env:
            - {name: HOME, value: /tmp}
          volumeMounts:
            - {name: config, mountPath: /etc/backend.ai, readOnly: true}
      volumes:
        - name: template
          configMap: {name: appproxy-worker}
        # The rendered config with the secrets: memory only.
        - name: config
          emptyDir: {medium: Memory}
{{- end }}
