{{- if .Values.baiDra.drivers }}
{{- $policy := include "backendai-cluster.gpuAllocationPolicy" . }}
{{- $mountRoot := .Values.baiDra.mountRoot }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bai-dra
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backendai-cluster.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backendai-bai-dra
  labels:
    {{- include "backendai-cluster.labels" . | nindent 4 }}
rules:
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceslices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backendai-bai-dra
  labels:
    {{- include "backendai-cluster.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backendai-bai-dra
subjects:
  - kind: ServiceAccount
    name: bai-dra
    namespace: {{ .Release.Namespace }}
---
# bai-dra writes only its own node's ResourceSlices of its drivers: the node comes from the
# node-bound ServiceAccount token of the DaemonSet Pod.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: backendai-bai-dra-slices
  labels:
    {{- include "backendai-cluster.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["resource.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["resourceslices"]
  matchConditions:
    - name: bai-dra
      expression: request.userInfo.username == "system:serviceaccount:{{ .Release.Namespace }}:bai-dra"
  variables:
    - name: node
      expression: >-
        "authentication.kubernetes.io/node-name" in request.userInfo.extra &&
        size(request.userInfo.extra["authentication.kubernetes.io/node-name"]) == 1 ?
        request.userInfo.extra["authentication.kubernetes.io/node-name"][0] : ""
    - name: slice
      expression: 'request.operation == "DELETE" ? oldObject : object'
    - name: drivers
      {{- $driverNames := list }}
      {{- range .Values.baiDra.drivers }}
      {{- $driverNames = append $driverNames .driverName }}
      {{- end }}
      expression: {{ toJson (uniq $driverNames) | squote }}
  validations:
    - expression: variables.node != ""
      message: bai-dra needs a node-bound ServiceAccount token.
    - expression: >-
        variables.slice.spec.?nodeName.orValue("") == variables.node &&
        (request.operation != "UPDATE" || oldObject.spec.?nodeName.orValue("") == variables.node)
      messageExpression: '"bai-dra on " + variables.node + " may write only the ResourceSlices of its node"'
    - expression: variables.slice.spec.driver in variables.drivers
      messageExpression: '"bai-dra may write only the ResourceSlices of its drivers: " + variables.drivers.join(", ")'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: backendai-bai-dra-slices
  labels:
    {{- include "backendai-cluster.labels" . | nindent 4 }}
spec:
  policyName: backendai-bai-dra-slices
  validationActions: [Deny]
{{- $classes := dict }}
{{- range .Values.baiDra.drivers }}
{{- $name := required "baiDra.drivers[].name is required" .name }}
{{- if not (or .nodeSelector .affinity) }}
{{- fail (printf "baiDra.drivers %s: set nodeSelector or affinity to the nodes bai-dra owns (dra.backend.ai/driver-mode=bai)" $name) }}
{{- end }}
{{- $isolation := include "backendai-cluster.baiDraIsolation" . }}
{{- if not (has $isolation (list "hami-core" "bai-hook" "none")) }}
{{- fail (printf "baiDra.drivers %s: isolation must be hami-core, bai-hook or none, not %q" $name $isolation) }}
{{- end }}
{{- if and .shared (eq $isolation "none") }}
{{- fail (printf "baiDra.drivers %s: shared devices need an isolation provider (isolation: hami-core or bai-hook)" $name) }}
{{- end }}
{{- if and (eq $isolation "hami-core") (not .hamiCore) }}
{{- fail (printf "baiDra.drivers %s: isolation hami-core needs hamiCore (image, libDir)" $name) }}
{{- end }}
{{- if and (contains "accelerator.cuda_open." (.plugin | default "")) (ne ((.pluginConfig | default dict).device_injector | default "") "cdi") }}
{{- fail (printf "baiDra.drivers %s: the cuda_open plugin needs pluginConfig.device_injector: cdi (a DRA node has no Docker)" $name) }}
{{- end }}
{{- if and .dynamicMig (ne $policy "bai") }}
{{- fail (printf "baiDra.drivers %s: dynamicMig needs gpuAllocationPolicy bai, not %q" $name $policy) }}
{{- end }}
{{- if and .dynamicMig (not (include "backendai-cluster.baiDraGpu" .)) }}
{{- fail (printf "baiDra.drivers %s: dynamicMig is for NVIDIA GPU entries (a CUDA plugin or gpu: true)" $name) }}
{{- end }}
{{- if and .shared (eq $policy "device-plugin") }}
{{- fail (printf "baiDra.drivers %s: gpuAllocationPolicy device-plugin has no fraction (shared) pool" $name) }}
{{- end }}
{{- if not (hasKey $classes .driverName) }}
{{- $_ := set $classes .driverName true }}
---
# Drivers of one name run different plugins on different nodes; one DeviceClass serves them.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: {{ required "baiDra.drivers[].driverName is required" .driverName }}
  labels:
    {{- include "backendai-cluster.labels" $ | nindent 4 }}
spec:
  selectors:
    - cel:
        expression: device.driver == {{ .driverName | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bai-dra-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "backendai-cluster.labels" $ | nindent 4 }}
data:
  {{- toYaml (.files | default dict) | nindent 2 }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: bai-dra-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "backendai-cluster.labels" $ | nindent 4 }}
    app.kubernetes.io/name: bai-dra-{{ $name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bai-dra-{{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bai-dra-{{ $name }}
    spec:
      serviceAccountName: bai-dra
      {{- with (.priorityClassName | default $.Values.baiDra.priorityClassName) }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with .nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # A GPU entry never runs on a node whose GPUs the device plugin or another driver allocates.
      affinity:
        {{- include "backendai-cluster.baiDraAffinity" (dict "root" $ "driver" .) | nindent 8 }}
      {{- with .tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq $isolation "hami-core" }}
      initContainers:
        # HAMi-core's preload library goes to the node: CDI mounts it read-only into shared
        # containers. A rename, not an overwrite: running containers keep the file they mapped.
        - name: hami-core
          image: {{ required "hamiCore.image is required" .hamiCore.image }}
          command: [sh, -ec]
          args:
            - >-
              cp /k8s-vgpu/lib/nvidia/libvgpu.so.* /host/.libvgpu.so.tmp &&
              mv -f /host/.libvgpu.so.tmp /host/libvgpu.so &&
              echo /usr/local/vgpu/libvgpu.so > /host/.ld.so.preload.tmp &&
              mv -f /host/.ld.so.preload.tmp /host/ld.so.preload
          volumeMounts:
            - {name: hami-core, mountPath: /host}
      {{- end }}
      containers:
        - name: driver
          image: {{ include "backendai-cluster.image" $.Values.baiDra.driverImage }}
          env:
            - {name: BAI_DRA_DRIVER_NAME, value: {{ .driverName | quote }}}
            - {name: BAI_DRA_HEALTH_ADDR, value: ":8081"}
            {{- if .dynamicMig }}
            - {name: BAI_DRA_DYNAMIC_MIG, value: "true"}
            - {name: BAI_DRA_NVIDIA_DRIVER_ROOT, value: /driver-root}
            {{- end }}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          ports:
            - {name: health, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 10
          {{- if .dynamicMig }}
          # NVML changes the MIG layout: the GPU device nodes and the node's libnvidia-ml.
          securityContext:
            privileged: true
          {{- end }}
          resources:
            {{- toYaml (.driverResources | default $.Values.baiDra.resources.driver) | nindent 12 }}
          volumeMounts:
            - {name: bridge, mountPath: /run/bai-dra}
            - {name: plugins-registry, mountPath: /var/lib/kubelet/plugins_registry}
            - {name: plugins, mountPath: /var/lib/kubelet/plugins}
            - {name: cdi, mountPath: /var/run/cdi}
            {{- if .dynamicMig }}
            - {name: driver-root, mountPath: /driver-root, readOnly: true, mountPropagation: HostToContainer}
            {{- end }}
        - name: plugin-host
          # An image with the entry's plugin (pluginHostImage), e.g. the enterprise CUDA plugin for bai-hook.
          image: {{ include "backendai-cluster.image" (.pluginHostImage | default $.Values.image) }}
          args: ["ai.backend.dra.host"]
          workingDir: /etc/backend.ai
          env:
            - {name: BAI_DRA_PLUGIN, value: {{ required "baiDra.drivers[].plugin is required" .plugin | quote }}}
            - {name: BAI_DRA_PLUGIN_CONFIG, value: {{ toJson (.pluginConfig | default dict) | quote }}}
            - {name: BAI_DRA_BRIDGE_SOCKET, value: /run/bai-dra/bridge.sock}
            - {name: BAI_DRA_MOUNT_ROOT, value: {{ $mountRoot | quote }}}
            - {name: HOME, value: /tmp}
            - {name: BAI_DRA_SHARED, value: {{ .shared | default false | quote }}}
            - {name: BAI_DRA_ISOLATION, value: {{ $isolation | quote }}}
            - {name: BAI_DRA_DYNAMIC_MIG, value: {{ .dynamicMig | default false | quote }}}
            {{- if eq $isolation "hami-core" }}
            - {name: BAI_DRA_HAMI_LIB_DIR, value: {{ .hamiCore.libDir | quote }}}
            {{- end }}
            {{- if eq $isolation "bai-hook" }}
            - {name: BAI_DRA_HOOK_DISTRO, value: {{ (.baiHook | default dict).distro | default "ubuntu22.04" | quote }}}
            - {name: BAI_DRA_VAR_BASE_PATH, value: {{ $.Values.baiDra.varBasePath | quote }}}
            {{- end }}
            {{- range $k, $v := .pluginHostEnv }}
            - {name: {{ $k }}, value: {{ $v | quote }}}
            {{- end }}
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import socket, sys
                  s = socket.socket(socket.AF_UNIX)
                  s.settimeout(5)
                  s.connect("/run/bai-dra/bridge.sock")
                  s.sendall(b"GET /v1/health HTTP/1.0\r\n\r\n")
                  sys.exit(0 if b" 200 " in s.recv(64) else 1)
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsUser: 0
          resources:
            {{- toYaml (.pluginHostResources | default $.Values.baiDra.resources.pluginHost) | nindent 12 }}
          volumeMounts:
            - {name: bridge, mountPath: /run/bai-dra}
            - {name: files, mountPath: /etc/backend.ai}
            - {name: tmp, mountPath: /tmp}
            # The files plugins generate for a claim: CDI mounts name the node path, so the
            # container sees it at the same path.
            - {name: mounts, mountPath: {{ $mountRoot }}}
            # Plugins that name devices of other CDI specs check that the spec exists.
            - {name: cdi, mountPath: /var/run/cdi, readOnly: true}
            - {name: cdi-static, mountPath: /etc/cdi, readOnly: true}
            {{- if eq $isolation "bai-hook" }}
            # The plugin's hook cache (agent.var-base-path): CDI mounts the hook from the node path.
            - {name: var-base, mountPath: {{ $.Values.baiDra.varBasePath }}}
            {{- end }}
      volumes:
        - {name: bridge, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - name: files
          configMap: {name: bai-dra-{{ $name }}}
        - name: mounts
          hostPath: {path: {{ $mountRoot }}, type: DirectoryOrCreate}
        - name: plugins-registry
          hostPath: {path: /var/lib/kubelet/plugins_registry, type: Directory}
        - name: plugins
          hostPath: {path: /var/lib/kubelet/plugins, type: DirectoryOrCreate}
        - name: cdi
          hostPath: {path: /var/run/cdi, type: DirectoryOrCreate}
        - name: cdi-static
          hostPath: {path: /etc/cdi, type: DirectoryOrCreate}
        {{- if .dynamicMig }}
        - name: driver-root
          hostPath: {path: {{ $.Values.baiDra.nvidiaDriverRoot | default "/" }}, type: Directory}
        {{- end }}
        {{- if eq $isolation "hami-core" }}
        - name: hami-core
          hostPath: {path: {{ required "hamiCore.libDir is required" .hamiCore.libDir }}, type: DirectoryOrCreate}
        {{- end }}
        {{- if eq $isolation "bai-hook" }}
        - name: var-base
          hostPath: {path: {{ $.Values.baiDra.varBasePath }}, type: DirectoryOrCreate}
        {{- end }}
{{- end }}
{{- end }}
