{{- if .Values.nodeHelper.enabled }}
# node helper (suggestion-1122 9.2): session commit and push with the node's containerd.
# Its token comes from an existing Secret that the gateway reads too (nodeHelper.tokenSecret).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-helper
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backendai-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/name: node-helper
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-helper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-helper
    spec:
      automountServiceAccountToken: false
      {{- with .Values.nodeHelper.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeHelper.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeHelper.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: helper
          image: {{ include "backendai-cluster.image" .Values.nodeHelper.image }}
          args: ["ai.backend.kube.nodehelper"]
          env:
            - {name: HOME, value: /tmp}
            - {name: BACKENDAI_NODE_HELPER_PORT, value: {{ .Values.nodeHelper.port | quote }}}
            - name: BACKENDAI_NODE_HELPER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "nodeHelper.tokenSecret.name is required" .Values.nodeHelper.tokenSecret.name }}
                  key: {{ .Values.nodeHelper.tokenSecret.key }}
          ports:
            - {name: api, containerPort: {{ .Values.nodeHelper.port }}}
          securityContext:
            # containerd's socket and snapshotter are root's.
            runAsUser: 0
          resources:
            {{- toYaml .Values.nodeHelper.resources | nindent 12 }}
          volumeMounts:
            - {name: containerd, mountPath: /run/containerd/containerd.sock}
            - {name: nerdctl, mountPath: /var/lib/nerdctl}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: containerd
          hostPath: {path: /run/containerd/containerd.sock, type: Socket}
        - {name: nerdctl, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
---
# Only the session gateway reaches the helper's API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: node-helper
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backendai-cluster.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: node-helper
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: session-gateway
      ports:
        - {protocol: TCP, port: {{ .Values.nodeHelper.port }}}
{{- end }}
