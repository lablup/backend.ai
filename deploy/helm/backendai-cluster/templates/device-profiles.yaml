{{- $policy := include "backendai-cluster.gpuAllocationPolicy" . }}
{{- $profiles := .Values.deviceProfiles }}
{{- range $profiles }}
{{- if and (ne $policy "bai") (eq .sharingMode "fraction") }}
{{- fail (printf "deviceProfiles %s: gpuAllocationPolicy %s allows no fraction profile" .name $policy) }}
{{- end }}
{{- if and .extendedResourceName (ne .sharingMode "exclusive") }}
{{- fail (printf "deviceProfiles %s: extendedResourceName needs sharingMode exclusive" .name) }}
{{- end }}
{{- if .sharedSlot }}
{{- $name := .name }}
{{- if ne $policy "bai" }}
{{- fail (printf "deviceProfiles %s: gpuAllocationPolicy %s has no shared devices for sharedSlot" $name $policy) }}
{{- end }}
{{- if ne .sharingMode "exclusive" }}
{{- fail (printf "deviceProfiles %s: sharedSlot needs sharingMode exclusive" $name) }}
{{- end }}
{{- $match := false }}
{{- $profile := . }}
{{- range $profiles }}
{{- if and (eq .slotName $profile.sharedSlot) (eq .sharingMode "fraction") (eq .driverName $profile.driverName) (eq .deviceClassName $profile.deviceClassName) }}
{{- $match = true }}
{{- end }}
{{- end }}
{{- if not $match }}
{{- fail (printf "deviceProfiles %s: sharedSlot %s needs a fraction profile of that slot with the same driverName and deviceClassName" $name .sharedSlot) }}
{{- end }}
{{- end }}
---
apiVersion: scheduling.backend.ai/v1alpha1
kind: DeviceProfile
metadata:
  name: {{ .name }}
  labels:
    {{- include "backendai-cluster.labels" $ | nindent 4 }}
spec:
  {{- toYaml (omit . "name") | nindent 2 }}
{{- end }}
