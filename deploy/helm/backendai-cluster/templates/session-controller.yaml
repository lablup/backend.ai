apiVersion: v1
kind: ServiceAccount
metadata:
  name: session-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backendai-cluster.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backendai-session-controller
  labels:
    {{- include "backendai-cluster.labels" . | nindent 4 }}
rules:
  - apiGroups: ["backend.ai"]
    resources: ["sessionworkloads"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["backend.ai"]
    resources: ["sessionworkloads/status", "sessionworkloads/finalizers"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["scheduling.backend.ai"]
    resources: ["podgroups"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "services", "secrets"]
    verbs: ["get", "list", "watch", "create", "patch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["scheduling.backend.ai"]
    resources: ["deviceprofiles"]
    verbs: ["get", "list", "watch"]
  # Sessions on the kueue scheduler adapter get a LocalQueue in their namespace.
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["localqueues"]
    verbs: ["get", "create"]
  # A finished kernel's log goes to the Manager as the Agent sends it.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # stat bridge: the kubelet's resource metrics
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumes", "persistentvolumeclaims"]
    verbs: ["get", "list", "create"]
  - apiGroups: ["backend.ai"]
    resources: ["storagebindings"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backendai-session-controller
  labels:
    {{- include "backendai-cluster.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backendai-session-controller
subjects:
  - kind: ServiceAccount
    name: session-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backendai-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/name: session-controller
spec:
  replicas: {{ if .Values.leaderElection.enabled }}{{ .Values.leaderElection.replicas }}{{ else }}1{{ end }}
  # One controller at a time until leader election exists.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: session-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: session-controller
    spec:
      serviceAccountName: session-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: {{ include "backendai-cluster.image" .Values.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["ai.backend.kube.controller"]
          env:
            - {name: BACKENDAI_KRUNNER_IMAGE, value: {{ include "backendai-cluster.image" .Values.krunner | quote }}}
            - {name: BACKENDAI_SYSTEM_NAMESPACE, value: {{ .Release.Namespace | quote }}}
            - {name: BACKENDAI_KERNEL_UID, value: {{ .Values.sessionController.kernelUid | quote }}}
            - {name: BACKENDAI_KERNEL_GID, value: {{ .Values.sessionController.kernelGid | quote }}}
            - {name: BACKENDAI_CONTROLLER_WORKERS, value: {{ .Values.sessionController.workers | quote }}}
            - {name: BACKENDAI_LOG_LEVEL, value: {{ .Values.sessionController.logLevel | quote }}}
            - {name: BACKENDAI_SOKOVAN_BIND_MODE, value: {{ .Values.sokovanScheduler.bindMode | quote }}}
            - {name: BACKENDAI_KUEUE_CLUSTER_QUEUE, value: {{ .Values.kueue.clusterQueue | quote }}}
            {{- include "backendai-cluster.eventEnv" . | nindent 12 }}
            {{- if .Values.leaderElection.enabled }}
            - {name: BACKENDAI_LEADER_ELECTION, value: "true"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            {{- end }}
          ports:
            - {name: metrics, containerPort: 9100}

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            {{- toYaml .Values.sessionController.resources | nindent 12 }}
      {{- with .Values.sessionController.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sessionController.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
# The kernels' utilization (backendai_container_utilization) for Prometheus. Headless: Prometheus
# scrapes every replica (DNS SD); only the leader has values.
apiVersion: v1
kind: Service
metadata:
  name: session-controller-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backendai-cluster.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: session-controller
  ports:
    - {name: metrics, port: 9100, targetPort: metrics}
