{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backendai-control.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global: {scrape_interval: 10s}
    scrape_configs:
      # The kernels' utilization from each cluster's session controllers (every replica).
      - job_name: kube-session-controller
        dns_sd_configs:
          - names: {{ toJson .Values.prometheus.sessionControllerTargets }}
            type: A
            port: 9100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backendai-control.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata:
      labels: {app: prometheus}
      annotations:
        checksum/config: {{ toJson .Values.prometheus | sha256sum }}
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time={{ .Values.prometheus.retention }}"]
          ports: [{containerPort: 9090}]
          volumeMounts: [{name: config, mountPath: /etc/prometheus}]
      volumes: [{name: config, configMap: {name: prometheus}}]
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backendai-control.labels" . | nindent 4 }}
spec:
  selector: {app: prometheus}
  ports: [{port: 9090, targetPort: 9090}]
{{- end }}
{{- if .Values.loki.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backendai-control.labels" . | nindent 4 }}
data:
  loki.yaml: |
    auth_enabled: false
    server: {http_listen_port: 3100}
    common:
      path_prefix: /loki
      replication_factor: 1
      ring: {kvstore: {store: inmemory}}
      storage: {filesystem: {chunks_directory: /loki/chunks, rules_directory: /loki/rules}}
    schema_config:
      configs:
        - {from: "2024-01-01", store: tsdb, object_store: filesystem, schema: v13, index: {prefix: index_, period: 24h}}
    limits_config: {retention_period: {{ .Values.loki.retention }}, allow_structured_metadata: false}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backendai-control.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: {matchLabels: {app: loki}}
  template:
    metadata: {labels: {app: loki}}
    spec:
      securityContext: {fsGroup: 10001}
      containers:
        - name: loki
          image: {{ .Values.loki.image }}
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports: [{containerPort: 3100}]
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /loki}
      volumes:
        - {name: config, configMap: {name: loki}}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backendai-control.labels" . | nindent 4 }}
spec:
  selector: {app: loki}
  ports: [{port: 3100, targetPort: 3100}]
{{- end }}
