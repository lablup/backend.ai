apiVersion: apps/v1
kind: Deployment
metadata:
  name: manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backendai-control.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: manager}}
  template:
    metadata: {labels: {app: manager}}
    spec:
      containers:
        - name: manager
          image: {{ include "backendai-control.image" .Values.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, -m, ai.backend.cli, mgr, start-server, -f, /etc/backend.ai/manager.toml]
          env:
            - {name: HOME, value: /tmp}
            - {name: BACKENDAI_PROMETHEUS_DIR, value: /tmp/prometheus}
          ports: [{containerPort: 8091}]
          readinessProbe: {tcpSocket: {port: 8091}, periodSeconds: 5}
          resources:
            {{- toYaml .Values.manager.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/backend.ai/manager.toml, subPath: manager.toml}
            - {name: config, mountPath: /etc/backend.ai/keys/manager.key_secret, subPath: manager.key_secret}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          secret: {secretName: {{ .Values.manager.configSecret }}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backendai-control.labels" . | nindent 4 }}
spec:
  type: {{ .Values.manager.service.type }}
  selector: {app: manager}
  ports:
    - port: 8091
      targetPort: 8091
      {{- if and (eq .Values.manager.service.type "NodePort") .Values.manager.service.nodePort }}
      nodePort: {{ .Values.manager.service.nodePort }}
      {{- end }}
{{- if .Values.manager.migration.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: manager-migration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backendai-control.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "backendai-control.image" .Values.image }}
          # A new database gets every table at once (old revisions cannot run from empty);
          # an existing one only its pending revisions.
          command:
            - sh
            - -c
            - >-
              python -m ai.backend.cli mgr -f /etc/backend.ai/manager.toml schema oneshot
              -f /etc/backend.ai/alembic.ini
              && python -m alembic -c /etc/backend.ai/alembic.ini upgrade head
          workingDir: /tmp
          env: [{name: HOME, value: /tmp}]
          volumeMounts:
            - {name: config, mountPath: /etc/backend.ai/manager.toml, subPath: manager.toml}
            - {name: config, mountPath: /etc/backend.ai/alembic.ini, subPath: alembic.ini}
      volumes:
        - name: config
          secret: {secretName: {{ .Values.manager.configSecret }}}
{{- end }}
