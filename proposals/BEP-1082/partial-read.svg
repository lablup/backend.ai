<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="860" height="200" fill="#ffffff"/>
  <rect x="20" y="30" width="230" height="140" rx="4" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="32" y="52" fill="#1e1b4b" font-weight="bold">searcher, querier</text>
  <text x="32" y="74" fill="#1e1b4b">fields: requested field names</text>
  <text x="32" y="96" fill="#475569">Searcher[Row, PartialData]</text>
  <text x="32" y="114" fill="#475569">DataQuerier[Row, PartialData]</text>

  <rect x="310" y="30" width="230" height="140" rx="4" fill="#f8fafc" stroke="#64748b"/>
  <text x="322" y="52" fill="#0f172a" font-weight="bold">repository ops</text>
  <text x="322" y="74" fill="#334155">SELECT id column</text>
  <text x="322" y="92" fill="#334155">+ columns of fields</text>
  <text x="322" y="114" fill="#64748b" font-size="11">order, cursor, filter: SQL only</text>

  <rect x="600" y="30" width="240" height="140" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="612" y="52" fill="#0f172a" font-weight="bold">{Entity}PartialData</text>
  <text x="612" y="74" fill="#334155">selected: requested fields, id</text>
  <text x="612" y="96" fill="#334155">not selected: NotSelectedError</text>
  <text x="612" y="118" fill="#334155">None: a NULL value</text>

  <line x1="250" y1="100" x2="308" y2="100" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="100" x2="598" y2="100" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
