version: "2"

run:
  # The integration tests are built only with this tag; lint them too.
  build-tags:
    - integration

linters:
  exclusions:
    paths:
      - ^third-party-plugins/

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/lablup/backend.ai
  exclusions:
    paths:
      - ^third-party-plugins/
