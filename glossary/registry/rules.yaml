# The source of GLOSSARY.md, GLOSSARY.ko.md and glossary/<topic>.md: edit here, then run
# `go generate ./...`. A word with a qualifier has other valid meanings, so a match is only
# reported for review. `except` lists longer expressions in which a word is allowed.
topics: [domain, architecture, permissions, operations, statuses, process, infrastructure, tools]
documents:
  en:
    path: GLOSSARY.md
    term_path: "glossary/{topic}.md"
    generated_note: "Generated file. Edit glossary/registry/ and run go generate ./..."
    title: "Glossary"
    intro:
      - ["Sets the words and writing style for Backend.AI documents, code comments, BEPs and PRs. One concept, one word.", "Code identifiers stay in English. A name under `Do not write` can remain in code until it is renamed."]
      - ["Korean: [GLOSSARY.ko.md](GLOSSARY.ko.md)"]
    index:
      heading: "Term files"
      lead: "Read this document before writing, then the term file for the topic. To find one word, search `glossary/`."
    expressions:
      heading: "Expressions to avoid"
      lead: "The term files set the terms. This list covers verbs and predicates. Korean wording is in [GLOSSARY.ko.md](GLOSSARY.ko.md)."
      columns: ["Do not write", "Write"]
    terms:
      title_prefix: "Glossary: "
      lead: "The style rules are in the [glossary](../GLOSSARY.md). Korean: [{topic}.ko.md]({topic}.ko.md)"
      columns: ["English", "Meaning", "Do not write", "Note"]
  ko:
    path: GLOSSARY.ko.md
    term_path: "glossary/{topic}.ko.md"
    generated_note: "생성 파일입니다. glossary/registry/ 를 고치고 go generate ./... 를 실행합니다."
    title: "용어집"
    intro:
      - ["Backend.AI 문서, 코드 주석, BEP, PR 에서 사용하는 어휘와 문체를 정합니다. 개념 하나에 어휘 하나입니다.", "코드 식별자는 영어 그대로 사용하고, 이름을 바꾸기 전까지 `사용하지 않는 어휘` 에 있어도 코드에 남을 수 있습니다."]
    index:
      heading: "용어 파일"
      lead: "글을 쓸 때 이 문서를 먼저 읽고, 다루는 주제의 용어 파일을 읽습니다. 어휘 하나를 찾을 때는 `glossary/` 를 검색합니다."
    expressions:
      heading: "사용하지 않는 표현"
      lead: "용어 표기는 용어 파일이 정합니다. 여기는 동사와 서술어입니다."
      columns: ["사용하지 않는 표현", "대신"]
    terms:
      title_prefix: "용어집: "
      lead: "문체 규칙은 [용어집](../GLOSSARY.ko.md)을 따릅니다."
      columns: ["한글", "English", "뜻", "사용하지 않는 어휘", "메모"]
style:
  en:
    - heading: "Style rules"
      rules:
        - "Rule documents (AGENTS.md, KNOWLEDGE.md, skills, prompts): use the imperative or the present tense"
        - "One concept, one word. Do not reuse a word for a different concept"
        - "Spell out abbreviations or explain them"
        - "Do not write SSOT. Say what the reference value is"
        - "Qualify generic words with where they apply (storage namespace)"
        - "Write owner as {target} owner"
        - "Fragments are fine in lists and table cells"
        - "Status labels are adjectives or past participles (active, failed, deleted)"
        - "Use one verb per operation: create, update, delete, change, run, get, call"
        - "create = new item, add = into an existing set, register = make an external thing known"
        - "remove = out of a set. The glossary defines delete and purge"
        - "fix = correct a defect, update = change a value"
        - "check = look at it, verify = run a scenario and read the result, get = read a value"
        - "No nominalized filler. Prefer active voice. Avoid regarding, with respect to"
        - "Do not end with a question"
        - "Use parentheses only to explain a term"
        - "Use arrows only for flows, state changes and lists, not inside sentences"
        - "Do not join sentences with a dash"
        - "Comma for like items, slash for 3-4 contrasting items, no middle dot"
        - "Avoid placeholder examples (A, B). Name what it is"
        - "Use only issue keys and PR numbers, always with a description"
        - "Prefix the service name when two services share a word"
        - "Write a term in the exact form the term files give, including capitalization"
    - heading: "Document templates and notation"
      rules:
        - "Do not join sentences with a dash (` — `, ` -- `). Split the sentence or use a colon or parentheses"
        - "Write arrows as →. Use them only for flows, state changes and lists. Inside a sentence, state the direction in words"
        - "Use commas for lists of values and slashes for contrasts. Do not use the middle dot"
        - "Write and, not &"
        - "Write prohibitions as Do not, not Do NOT or NEVER use"
        - "Use status symbols (✅, ❌) only in limited places such as tables"
        - "Inside a list item, separate an explanation with a hyphen (-)"
        - "Refer to a section by describing it, not by its number"
        - "Refer to a skill by one name (/test-guide)"
        - "Use one heading template for KNOWLEDGE.md"
        - "KNOWLEDGE.md holds only background and rationale, and does not repeat AGENTS.md"
        - "State an explanation once per document"
        - "A closing summary does not list earlier sections again"
        - "Title the related documents section Related documents"
        - "Introduce examples with See and supplementary input with Secondary"
        - "Write a rule as a sentence instead of an invented label (Forward direction and the like)"
        - "AGENTS.md rule documents keep Guardrails"
  ko:
    - heading: "문체 규칙"
      rules:
        - "개념 하나에 어휘 하나. 같은 어휘를 다른 개념에 사용하지 않습니다"
        - "오류 대신 에러로 씁니다"
        - "약어는 풀어 쓰거나 설명을 붙입니다"
        - "SSOT 를 사용하지 않습니다. 기준이 되는 값처럼 풀어 씁니다"
        - "일반화된 어휘는 앞에 사용처를 붙입니다(스토리지 네임스페이스)"
        - "소유자는 {대상} 소유자 로 씁니다"
        - "규칙 문서(AGENTS.md, KNOWLEDGE.md, 스킬, prompt)는 ~다 로 씁니다"
        - "사람이 읽는 글(BEP 본문 설명, 보고서, 이슈, 리뷰)은 ~합니다 로 씁니다"
        - "나열과 표 칸은 명사형도 씁니다"
        - "상태, 결과 레이블은 명사형으로 씁니다(활성, 실패, 삭제됨)"
        - "동작은 한자어 동사를 주로 사용합니다. 생성, 수정, 삭제, 변경, 실행, 조회, 호출"
        - "생성은 새 항목, 추가는 기존 묶음에 넣을 때, 등록은 외부의 것을 알게 할 때 씁니다"
        - "제거는 묶음에서 뺄 때 씁니다. 삭제와 영구 삭제의 뜻은 용어집이 정합니다"
        - "수정은 잘못을 바로잡을 때, 변경은 값이 바뀔 때 씁니다"
        - "확인, 검사, 검증, 점검, 조회를 구분해 씁니다"
        - "~는 것이다 를 사용하지 않습니다. 되어 있다 는 능동형으로, ~에 대해 는 구체적인 조사로 씁니다"
        - "질문으로 끝내지 않습니다"
        - "괄호는 용어 설명에만 씁니다"
        - "화살표는 흐름, 상태 변경, 나열에만 씁니다. 문장 안에서는 사용하지 않습니다"
        - "대시로 문장을 잇지 않습니다"
        - "나열은 성격이 같으면 쉼표, 성격이 다른 3~4개를 대비하면 빗금. 가운뎃점은 사용하지 않습니다"
        - "변수 예시(A, B)는 지양합니다"
        - "내부 키는 이슈 키와 PR 번호만 사용하고 늘 설명을 붙입니다. 외부 노출 글에는 가능하면 사용하지 않습니다"
        - "같은 어휘가 두 서비스에 있으면 서비스 이름을 앞에 붙입니다"
        - "영어로 둔 어휘는 소문자 그대로 씁니다. 문장 첫머리에서도 바꾸지 않습니다. 용어 절이 Agent, Manager 처럼 대문자로 정한 이름은 그대로 씁니다"
        - "이(가), 을(를)처럼 조사를 억지로 붙이지 않습니다. 상황에 맞게 씁니다"
    - heading: "문서 템플릿과 표기"
      rules:
        - "대시로 문장을 잇지 않습니다. 문장을 나누거나 콜론, 괄호로 대체합니다(` — `, ` -- `)"
        - "화살표는 → 하나로 씁니다. 흐름, 상태 변경, 나열에만 쓰고 문장 안에서는 어휘로 방향을 씁니다"
        - "값 나열은 쉼표, 대비는 빗금을 씁니다. 가운뎃점을 사용하지 않습니다"
        - "&와 and 는 and 로 씁니다"
        - "금지 문장은 Do not 으로 씁니다(Do NOT, NEVER use 를 사용하지 않습니다)"
        - "상태 기호(✅, ❌)는 테이블 같은 한정된 곳에만 씁니다"
        - "목록 항목 안의 설명 구분은 하이픈(-)을 씁니다"
        - "영어 단어와 조사 사이를 띄어 씁니다(purge 는, id 와)"
        - "한글 문서에서 영어 동사를 섞지 않습니다(scan한다 → 스캔한다, search → 검색)"
        - "절 번호(9절)로 참조하지 않고 설명을 붙여 참조합니다"
        - "같은 스킬은 한 이름으로 가리킵니다(/test-guide)"
        - "KNOWLEDGE.md 제목은 하나의 템플릿으로 씁니다"
        - "KNOWLEDGE.md 는 배경과 근거만 적고 AGENTS.md 문장을 반복하지 않습니다"
        - "같은 설명은 한 문서에서 한 번만 적습니다"
        - "끝의 요약 절은 앞 절을 다시 나열하지 않습니다"
        - "관련 문서 절 제목은 Related documents 로 씁니다"
        - "예시 안내 어휘는 See, 보조 입력 어휘는 Secondary 로 씁니다"
        - "임시로 지어낸 라벨(Forward direction 등) 대신 규칙 문장으로 씁니다"
        - "AGENTS.md 규칙 문서는 Guardrails(가드레일)를 유지합니다"
