  verb:
    dictionary_ending: 다
    consonant_endings: [다, 고, 지, 는, 면, 며, 기, 게, 던, 니, 시, 겠]
    vowel_endings: [아, 어, 았, 었, 은, 을, 습]
    open_stem_finals: [ㄴ, ㄹ, ㅂ]
    past_final: ㅆ
    dropped_final:
      final: ㄹ
      endings: [는, 니]
      added: ㄴ
    contracted_syllables:
      하: 해
    contracted_vowels:
      ㅡ: ㅓ
      ㅣ: ㅕ
      ㅜ: ㅝ
      ㅗ: ㅘ
    irregular:
      syllable: 르
      added_final: ㄹ
      endings: [러, 라, 렀, 랐]
