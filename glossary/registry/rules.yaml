# The rules of the words check, with the term files in terms/. A match prints `instead` and
# `reason`. A word with a qualifier has other valid meanings, so a match is only reported for
# review. `except` lists longer expressions in which a word is allowed.
expressions:
  - lang: en
    word: "bring up, brought up, Brings up"
    instead: "start"
    reason: "Prefer a single verb to a phrasal verb."
  - lang: en
    word: "refuse"
    instead: "reject"
    reason: "Use one word for one concept."
    except: ["refuse to start", "refuses to start", "is refused a"]
  - lang: en
    word: "discard"
    qualifier: "an alternative"
    instead: "reject"
    reason: "Use one word for one concept."
  - lang: en
    word: "pair up"
    instead: "combine"
    reason: "Prefer a single verb to a phrasal verb."
  - lang: en
    word: "tell apart, keep apart, split apart"
    instead: "distinguish"
    reason: "Prefer a single verb to a phrasal verb."
  - lang: en
    word: "is answered for by"
    instead: "active voice: the owning entity answers for it"
    reason: "Prefer active voice."
  - lang: en
    word: "outgoing pattern, parent-fixed variants are the outgoing pattern"
    instead: "legacy pattern, marked as deprecated"
    reason: "Use one word for one concept."
  - lang: en
    word: "stand for"
    instead: "represent"
    reason: "Prefer a single verb to a phrasal verb."
  - lang: en
    word: "which is why"
    instead: "so"
    reason: "Prefer the shorter word."
  - lang: en
    word: "line"
    qualifier: "of a table"
    instead: "row"
    reason: "Use one word for one concept."
