title:
  en:
    page: "Technology and tool names"
    link: "Technology and tool names"
    description: "external technology and tool names"
  ko:
    page: "기술, 도구 이름"
    link: "기술, 도구 이름"
    description: "외부 기술과 도구 이름"
terms:
  - english: "Alembic"
    korean: "Alembic"
    meaning:
      en: "A tool that applies and rolls back DB schema migrations for Backend.AI components."
      ko: "Backend.AI 컴포넌트의 DB schema migration 을 적용하고 롤백하는 도구입니다."
  - english: "Callosum"
    korean: "Callosum"
    meaning:
      en: "A ZeroMQ-based library used for RPC between the manager and agents."
      ko: "manager 와 agent 사이 RPC 에 사용하는 ZeroMQ 기반 라이브러리입니다."
  - english: "cherry-pick"
    korean: "cherry-pick"
    meaning:
      en: "A method of moving changes implemented first in main to an x.y release branch."
      ko: "main 에 먼저 구현한 변경을 x.y release branch 로 옮기는 방법입니다."
  - english: "deep merge"
    korean: "deep merge"
    meaning:
      en: "A merge that combines all fragments visible to the caller in ascending allow-list rank, recursing into nested objects while replacing scalars and lists as a whole."
      ko: "caller 에게 보이는 모든 fragment 를 allow-list rank 오름차순으로 합치되 중첩 객체는 재귀하고 스칼라와 목록은 통째로 교체하는 병합입니다."
  - english: "distributed lock"
    korean: "distributed lock"
    meaning:
      en: "A distributed locking backend that the manager can replace, chosen among filelock, pg_advisory, redlock, etcd and etcetra, with pg_advisory as the default."
      ko: "manager 가 교체해서 사용하는 분산 잠금 backend 로 filelock, pg_advisory, redlock, etcd, etcetra 중에서 고르고 기본값은 pg_advisory 입니다."
    avoid:
      en: ["replacible distributed lock backend"]
      ko: ["replacible distributed lock backend"]
  - english: "Docker backend"
    korean: "Docker backend"
    meaning:
      en: "A backend implementation where the agent handles kernel containers with docker among multiple container runtimes."
      ko: "agent 가 여러 container runtime 중 docker 로 kernel container 를 다루는 backend 구현입니다."
  - english: "Docker Swarm"
    korean: "Docker Swarm"
    meaning:
      en: "A foundation used to build the overlay network of a multi-node multi-kernel session."
      ko: "다중 노드 멀티 커널 세션 의 overlay network 를 구성하는 데 사용하는 기반입니다."
    avoid:
      en: ["Swarm"]
      ko: ["Swarm"]
  - english: "dotfile"
    korean: "dotfile"
    meaning:
      en: "A collection of user configuration files set on an entity."
      ko: "entity 에 설정하는 사용자 설정 파일 모음입니다."
  - english: "etcd"
    korean: "etcd"
    meaning:
      en: "A configuration source that holds cluster-wide settings and manager state and hot reloads on change."
      ko: "cluster 전역 설정과 manager 상태를 담고 변경 시 hot reload 되는 설정 소스입니다."
  - english: "FastTrack"
    korean: "FastTrack"
    meaning:
      en: "An add-on service that designs and runs compute task pipelines on top of the manager."
      ko: "manager 위에서 연산 작업 파이프라인을 설계·실행하는 add-on 서비스입니다."
  - english: "Forklift"
    korean: "Forklift"
    meaning:
      en: "A standalone service that builds and imports Backend.AI compatible container images."
      ko: "Backend.AI 호환 컨테이너 이미지를 만들고 가져오는 standalone 서비스입니다."
  - english: "Graphene"
    korean: "Graphene"
    meaning:
      en: "A subgraph that provides the manager's legacy GraphQL API and is being migrated to Strawberry."
      ko: "manager 의 이전 GraphQL API 를 제공하는 subgraph 로 Strawberry 로 옮겨지는 중입니다."
    avoid:
      en: ["Legacy GraphQL API"]
      ko: ["Legacy GraphQL API"]
  - english: "GraphQL Inspector"
    korean: "GraphQL Inspector"
    meaning:
      en: "A CI status check that inspects the GraphQL schema for breaking changes."
      ko: "GraphQL schema 의 breaking change 를 검사하는 CI status check 입니다."
  - english: "Hive Gateway"
    korean: "Hive Gateway"
    meaning:
      en: "A GraphQL gateway that federates the three GQL subgraphs of the manager (graphene, strawberry, public)."
      ko: "manager 의 GQL subgraph 세 개(graphene, strawberry, public)를 federation 하는 GraphQL gateway 입니다."
    avoid:
      en: ["Hive Router"]
      ko: ["Hive Router"]
  - english: "jail"
    korean: "jail"
    meaning:
      en: "A kernel execution environment that blocks some system calls according to policy."
      ko: "정책에 따라 일부 system call 을 막는 kernel 실행 환경입니다."
    avoid:
      en: ["Backend.AI Jail"]
      ko: ["Backend.AI Jail"]
  - english: "Kubernetes backend"
    korean: "Kubernetes backend"
    meaning:
      en: "A backend that handles kubernetes among the infrastructure implementations of an agent."
      ko: "agent 의 infrastructure 구현 중 kubernetes 를 다루는 backend 입니다."
    avoid:
      en: ["k8s"]
      ko: ["k8s"]
  - english: "mock accelerator"
    korean: "mock accelerator"
    meaning:
      en: "A simulator plugin that makes an accelerator device appear present without real hardware."
      ko: "실제 장치 없이 accelerator 장치가 있는 것처럼 보이게 하는 시뮬레이터 plugin 입니다."
    avoid:
      en: ["mock", "mock-up plugin", "mocked Accelerators"]
      ko: ["mock", "mock-up plugin", "mocked Accelerators"]
  - english: "Pants"
    korean: "Pants"
    meaning:
      en: "A build tool that handles build automation and dependency management."
      ko: "build 자동화와 의존성 관리를 맡는 빌드 도구입니다."
    avoid:
      en: ["Pantsbuild"]
      ko: ["Pantsbuild"]
  - english: "presigned URL"
    korean: "presigned URL"
    meaning:
      en: "A URL with an expiration time that allows direct upload to or download from object storage."
      ko: "object storage 에 직접 올리거나 받을 수 있게 만료 시간이 있는 URL 입니다."
  - english: "Prometheus"
    korean: "Prometheus"
    meaning:
      en: "A monitoring tool that collects operational metrics of components such as the manager."
      ko: "manager 등 컴포넌트의 운영 지표를 수집하는 모니터링 도구입니다."
  - english: "pydantic"
    korean: "pydantic"
    meaning:
      en: "A library used as the validator for REST API requests and responses since 24.03."
      ko: "24.03 부터 REST API 요청과 응답 validator 로 사용하는 라이브러리입니다."
  - english: "SDK"
    korean: "SDK"
    meaning:
      en: "A python library that uses the Backend.AI REST API."
      ko: "Backend.AI REST API 를 사용하는 python 라이브러리입니다."
  - english: "strawberry"
    korean: "strawberry"
    meaning:
      en: "A subgraph that provides the v2 GraphQL API of the Manager."
      ko: "Manager 의 v2 GraphQL API 를 제공하는 subgraph 입니다."
    avoid:
      en: ["New GraphQL API", "v2 schema"]
      ko: ["New GraphQL API", "v2 schema"]
  - english: "towncrier"
    korean: "towncrier"
    meaning:
      en: "A tool that collects changelog fragments in changes/ to build a changelog."
      ko: "changes/ 의 changelog fragment 를 모아 changelog 를 만드는 도구입니다."
  - english: "Traefik"
    korean: "Traefik"
    meaning:
      en: "A proxy that handles traffic forwarding instead of the worker and reads routes that the coordinator publishes."
      ko: "worker 대신 traffic forwarding 을 맡고 coordinator 가 route 를 발행해 읽게 하는 proxy 입니다."
    avoid:
      en: ["proxy dataplane"]
      ko: ["proxy dataplane"]
  - english: "TUS"
    korean: "TUS"
    meaning:
      en: "A resumable upload method in which the proxy manages offsets with a Valkey lease."
      ko: "resumable upload 방식으로 proxy 가 Valkey lease 로 offset 을 관리합니다."
    avoid:
      en: ["upload session"]
      ko: ["upload session"]
  - english: "Valkey"
    korean: "Valkey"
    meaning:
      en: "A dependency that holds cache data and also serves as an event queue."
      ko: "cache data 를 보유하고 event queue 를 겸하는 의존성입니다."
    avoid:
      en: ["Redis"]
      ko: ["Redis", "레디스"]
    note:
      en: "This is the documentation spelling. Changing config keys and code names is a separate task."
      ko: "문서 표기 기준입니다. 설정 키와 코드 이름 변경은 별도 작업입니다"
  - english: "VFS storage"
    korean: "VFS storage"
    meaning:
      en: "A filesystem backend behind a storage namespace."
      ko: "storage namespace 뒤의 filesystem backend 입니다."
