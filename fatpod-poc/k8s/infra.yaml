apiVersion: v1
kind: Namespace
metadata: {name: bai}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: bai}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:16.3-alpine
        env:
        - {name: POSTGRES_USER, value: postgres}
        - {name: POSTGRES_PASSWORD, value: develove}
        - {name: POSTGRES_DB, value: backend}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        ports: [{containerPort: 5432}]
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: bai}
spec: {selector: {app: postgres}, ports: [{port: 5432, targetPort: 5432}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: valkey, namespace: bai}
spec:
  replicas: 1
  selector: {matchLabels: {app: valkey}}
  template:
    metadata: {labels: {app: valkey}}
    spec:
      containers:
      - name: valkey
        image: valkey/valkey:9.1.0-alpine
        ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata: {name: valkey, namespace: bai}
spec: {selector: {app: valkey}, ports: [{port: 6379, targetPort: 6379}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: etcd, namespace: bai}
spec:
  replicas: 1
  selector: {matchLabels: {app: etcd}}
  template:
    metadata: {labels: {app: etcd}}
    spec:
      containers:
      - name: etcd
        image: quay.io/coreos/etcd:v3.5.14
        command: ["etcd","--data-dir=/data","--listen-client-urls=http://0.0.0.0:2379","--advertise-client-urls=http://0.0.0.0:2379"]
        ports: [{containerPort: 2379}]
        volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: etcd, namespace: bai}
spec: {selector: {app: etcd}, ports: [{port: 2379, targetPort: 2379}]}
