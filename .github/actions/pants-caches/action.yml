name: pants-caches
description: >-
  Restore or save the Pants named caches and the mypy cache. A save stores the
  named caches only when their key has no entry yet and the mypy cache per
  commit, then deletes the entries it superseded under the same ref. Which runs
  save is the caller's decision.
inputs:
  mode:
    description: "'restore' before Pants runs, 'save' after it"
    required: true
  mypy:
    description: "'true' to restore or save the mypy cache as well"
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Compute the cache keys
      id: keys
      shell: bash
      env:
        NAMED_PREFIX: pants-named-caches-${{ runner.os }}-${{ runner.arch }}-
        NAMED_HASH: ${{ hashFiles('pants.toml') }}-${{ hashFiles('python*.lock', 'tools/*.lock') }}
        MYPY_PREFIX: pants-mypy-${{ runner.os }}-
        SHA: ${{ github.sha }}
      run: |
        {
          echo "named-prefix=$NAMED_PREFIX"
          echo "named=$NAMED_PREFIX$NAMED_HASH"
          echo "mypy-prefix=$MYPY_PREFIX"
          echo "mypy=$MYPY_PREFIX$SHA"
        } >> "$GITHUB_OUTPUT"

    # The mypy cache lives inside the named caches and changes on every commit,
    # while the named caches change only with the lockfiles, so it is kept out of
    # them and cached on its own. A directory listed whole cannot exclude a child,
    # hence the per-child glob.
    - name: Restore the Pants named caches
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.cache/pants/named_caches/*
          !~/.cache/pants/named_caches/mypy_cache
        key: ${{ steps.keys.outputs.named }}
        restore-keys: ${{ steps.keys.outputs.named-prefix }}
    - name: Restore the mypy cache
      if: inputs.mode == 'restore' && inputs.mypy == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/pants/named_caches/mypy_cache
        key: ${{ steps.keys.outputs.mypy }}
        restore-keys: ${{ steps.keys.outputs.mypy-prefix }}

    - name: Look up the Pants named caches
      id: named-caches
      if: inputs.mode == 'save'
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.cache/pants/named_caches/*
          !~/.cache/pants/named_caches/mypy_cache
        key: ${{ steps.keys.outputs.named }}
        lookup-only: true
    - name: Save the Pants named caches
      id: save-named-caches
      if: inputs.mode == 'save' && steps.named-caches.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          ~/.cache/pants/named_caches/*
          !~/.cache/pants/named_caches/mypy_cache
        key: ${{ steps.keys.outputs.named }}
    - name: Delete the named caches the save superseded
      if: steps.save-named-caches.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        REF: ${{ github.ref }}
        PREFIX: ${{ steps.keys.outputs.named-prefix }}
        KEY: ${{ steps.keys.outputs.named }}
      run: .github/scripts/prune-ref-caches.sh "$REPO" "$REF" "$PREFIX" "$KEY"
    - name: Save the mypy cache
      id: save-mypy
      if: inputs.mode == 'save' && inputs.mypy == 'true'
      uses: actions/cache/save@v5
      with:
        path: ~/.cache/pants/named_caches/mypy_cache
        key: ${{ steps.keys.outputs.mypy }}
    - name: Delete the mypy caches the save superseded
      if: steps.save-mypy.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        REF: ${{ github.ref }}
        PREFIX: ${{ steps.keys.outputs.mypy-prefix }}
        KEY: ${{ steps.keys.outputs.mypy }}
      run: .github/scripts/prune-ref-caches.sh "$REPO" "$REF" "$PREFIX" "$KEY"
