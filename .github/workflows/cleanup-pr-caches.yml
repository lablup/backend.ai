name: cleanup-pr-caches

# A pull request's cache entries are readable only by its own runs, so they are
# dead weight once it is closed. Deleting them keeps the repository under its
# cache quota, where GitHub would otherwise evict the entries `main` saved.

on:
  pull_request:
    types: [closed]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    # A fork's pull_request carries a read-only token that cannot delete caches,
    # so fork PRs are out of scope, as in `cancel-superseded.yml`.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the cleanup script
        uses: actions/checkout@v6
        with:
          # The PR's merge ref may be gone once it is closed.
          ref: ${{ github.event.repository.default_branch }}
          lfs: false
          sparse-checkout: .github/scripts
      - name: Delete the pull request's caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: .github/scripts/delete-ref-caches.sh "$REPO" "$REF"
