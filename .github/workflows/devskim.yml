# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: DevSkim

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '18 4 * * 4'

jobs:
  lint:
    name: DevSkim
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run DevSkim scanner
        uses: microsoft/DevSkim-Action@v1
        with:
          ignore-globs: "**/.git/**,**/src/ai/backend/web/static/**,**/src/ai/backend/test/**,**/tests/**,**/docker-compose.halfstack-*.yml,**/configs/grafana/**,**/configs/graphql/**,**/configs/loki/**,**/configs/otel/**,**/configs/prometheus/**,**/configs/tempo/**,**/src/ai/backend/install/configs/docker-compose.yml,**/src/ai/backend/install/configs/gateway.config.ts,**/src/ai/backend/install/configs/grafana-provisioning/**,**/src/ai/backend/install/configs/loki-config.yaml,**/src/ai/backend/install/configs/otel-collector-config.yaml,**/src/ai/backend/install/configs/prometheus.yaml,**/src/ai/backend/install/configs/tempo-config.yaml"
          options-json: .devskim.json

      - name: Upload DevSkim scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: devskim-results.sarif
