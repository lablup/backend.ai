name: ci-typecheck

# mypy run directly on the files to check, with the cache `mypy-cache.yml` saves on main. Called by `ci.yml`.

on:
  workflow_call:
    inputs:
      targets-artifact:
        description: The artifact holding `typecheck.txt`, the targets to check, one file path per line
        type: string
        required: true
      annotate:
        description: Register the problem matchers that annotate the pull request (off for a fork)
        type: boolean
        required: true

permissions:
  contents: read

jobs:

  typecheck:
    runs-on: ubuntu-latest
    steps:
    - name: Check out the revision
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        lfs: false
    - name: Download the targets
      uses: actions/download-artifact@v5
      with:
        name: ${{ inputs.targets-artifact }}
        path: dist/ci-targets
    - name: Set up the venv
      id: venv
      uses: ./.github/actions/python-venv
    - name: Restore the mypy cache
      uses: actions/cache/restore@v5
      with:
        path: .mypy_cache
        key: mypy-main-${{ github.sha }}
        restore-keys: mypy-main-
    - name: Typecheck
      env:
        ANNOTATE: ${{ inputs.annotate }}
        MYPY: ${{ steps.venv.outputs.venv }}/bin/mypy
      run: |
        if [ "$ANNOTATE" == "true" ]; then
          echo "::add-matcher::.github/workflows/mypy-matcher.json"
        else
          echo "(skipping matchers for fork pull request)"
        fi
        .github/scripts/list-typecheck-files.sh dist/ci-targets/typecheck.txt > dist/ci-targets/typecheck-files.txt
        if [ ! -s dist/ci-targets/typecheck-files.txt ]; then
          echo "No targets to typecheck"
          exit 0
        fi
        "$MYPY" "@dist/ci-targets/typecheck-files.txt"
