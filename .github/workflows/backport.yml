name: backport

on:
  pull_request_target:
    types: [closed]
  issue_comment:
    types: [created]

concurrency:
  # One group per pull request: the merge-time run and a later `/backport`
  # comment on the same pull request must not race each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}

jobs:
  decide-targets:
    # Two ways in, one decision. A merged pull request carries the rules in its
    # own metadata; a `/backport` comment names the target versions outright.
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged)
      || (github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && startsWith(github.event.comment.body, '/backport'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      matrix: ${{ steps.targets.outputs.result }}
    steps:
      - name: Checkout the base revision
        uses: actions/checkout@v6
        with:
          lfs: false
      - name: Decide the target branches
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          # Never interpolate a comment body into the shell directly.
          COMMENT_BODY: ${{ github.event.comment.body }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          result=$(.github/scripts/decide-backport-targets.sh \
            --event "$EVENT_NAME" \
            --pr "$PR_NUMBER" \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --labels "$PR_LABELS" \
            --base "$PR_BASE" \
            --merge-commit "$MERGE_COMMIT" \
            --comment-body "$COMMENT_BODY" \
            --author-association "$AUTHOR_ASSOCIATION" \
            --pr-author "$PR_AUTHOR_LOGIN")
          echo "result=$result" >> "$GITHUB_OUTPUT"


  backport:
    if: ${{ needs.decide-targets.outputs.matrix != '[]' && needs.decide-targets.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    needs: decide-targets
    strategy:
      matrix:
        include: ${{ fromJson(needs.decide-targets.outputs.matrix) }}
      fail-fast: false
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.target_branch }}
      - name: Cherry-pick
        id: pick
        env:
          COMMIT_AUTHOR: ${{ matrix.author }}
          COMMIT_AUTHOR_EMAIL: ${{ matrix.author_email }}
          TARGET_COMMIT: ${{ matrix.commit }}
        run: |
          git config user.name "$COMMIT_AUTHOR"
          git config user.email "$COMMIT_AUTHOR_EMAIL"
          git fetch origin main "$TARGET_COMMIT"
          # Generated API docs: keep the release branch's copy (update-api-schema
          # regenerates them on the backport PR).
          git config merge.ours.driver true
          printf '%s\n' \
            "docs/manager/rest-reference/openapi.json merge=ours" \
            "docs/manager/graphql-reference/*.graphql merge=ours" \
            >> .git/info/attributes
          if ! git cherry-pick "$TARGET_COMMIT"; then
            # Source conflict: commit the markers as-is so the pull request is
            # still created (without auto-merge) -- CI fails on it until a
            # human resolves the markers on its branch.
            {
              echo "conflict_files<<EOF"
              git diff --name-only --diff-filter=U
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            git add -A
            GIT_EDITOR=true git cherry-pick --continue
          fi
      - name: Create the backport pull request
        id: pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676  # v7
        with:
          token: ${{ secrets.OCTODOG }}
          author: "${{ matrix.author }} <${{ matrix.author_email }}>"
          # The headline keeps the original `(#N)` suffix -- with no backport
          # trailers, that is the only provenance the commit carries.
          title: "${{ matrix.commit_headline }}"
          body: "This is an auto-generated backport of #${{ matrix.pr_number }} to the ${{ matrix.target_branch }} release."
          branch: "backport/${{ matrix.pr_number }}-to-${{ matrix.target_branch }}"
          base: ${{ matrix.target_branch }}
          labels: |
            backport
            ${{ matrix.labels }}
          assignees: ${{ matrix.author_login }}
      - name: Enable auto-merge
        if: ${{ steps.pr.outputs.pull-request-number && steps.pick.outputs.conflict_files == '' }}
        env:
          GH_TOKEN: ${{ secrets.OCTODOG }}
        run: gh pr merge "${{ steps.pr.outputs.pull-request-number }}" --auto --squash
      - name: Report the conflict
        if: ${{ failure() || steps.pick.outputs.conflict_files != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr_number }}
          TARGET_BRANCH: ${{ matrix.target_branch }}
          CONFLICT_FILES: ${{ steps.pick.outputs.conflict_files }}
          BACKPORT_PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          if [ -n "$BACKPORT_PR_URL" ] && [ -n "$CONFLICT_FILES" ]; then
            body=$(printf 'The backport to `%s` hit conflicts: %s was created with the conflict markers committed in:\n\n```\n%s\n```\n\nCI on it fails until the markers are resolved; check out its branch, fix, push, and merge it by hand (auto-merge is not enabled for conflicted backports).' "$TARGET_BRANCH" "$BACKPORT_PR_URL" "$CONFLICT_FILES")
          else
            body="The backport to \`$TARGET_BRANCH\` did not apply cleanly and has to be done by hand."
          fi
          gh pr comment "$PR_NUMBER" -b "$body"
