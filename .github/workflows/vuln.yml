name: vuln

# The Go vulnerability check: `go tool govulncheck ./...`.
# Called by `ci.yml` (pull requests into and pushes to `v2`) and `release.yml`.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - name: Set up Go
        id: go
        uses: ./.github/actions/go-setup
        with:
          cache-prefix: vuln
      - name: Check the vulnerabilities
        run: go tool govulncheck ./...
      - name: Save the Go caches
        if: github.event_name == 'push'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.go.outputs.cache-paths }}
          key: ${{ steps.go.outputs.cache-key-prefix }}${{ github.sha }}
