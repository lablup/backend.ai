name: vuln

# The Go vulnerability check: `go tool govulncheck ./...`.
# Called by `ci.yml` (pull requests into and pushes to `v2`) and `release.yml`, and run weekly on `v2`.

on:
  workflow_call:
  schedule:
    - cron: '37 3 * * 1'

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          # A scheduled run starts from the default branch; it checks the head of `v2`.
          ref: ${{ github.event_name == 'schedule' && 'v2' || '' }}
      - name: Set up Go
        id: go
        uses: ./.github/actions/go-setup
        with:
          cache-prefix: vuln
      - name: Check the vulnerabilities
        run: go tool govulncheck ./...
      - name: Save the Go caches
        if: github.event_name == 'push'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.go.outputs.cache-paths }}
          key: ${{ steps.go.outputs.cache-key-prefix }}${{ github.sha }}
