name: timeline-check

on:
  pull_request:
    types: [labeled, unlabeled, opened, synchronize, reopened]
permissions:
  contents: read

jobs:
  towncrier:
    if: |
      !contains(github.event.pull_request.labels.*.name, 'skip:changelog')
      && !contains(fromJSON('["flow:merge-queue", "flow:hotfix"]'), github.event.label.name)
      && !startsWith(github.event.pull_request.title, 'release:')
    runs-on: ubuntu-latest
    steps:
    - name: Get PR's fetch depth
      run: echo "PR_FETCH_DEPTH=$(( ${{ github.event.pull_request.commits }} + 1 ))" >> "${GITHUB_ENV}"
    - name: Checkout the revision
      uses: actions/checkout@v6
      with:
        lfs: false
        fetch-depth: ${{ env.PR_FETCH_DEPTH }}
        sparse-checkout: |
          changes
          tools
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        check-latest: true
    - name: Install dependencies
      run: |
        python -m pip install -U -r tools/towncrier-requirements.txt
    - name: Check existence of news fragment
      run: |
        # The oldest commit in the shallow checkout, not the first-parent root: in a
        # stacked PR the merge ref's first-parent chain is GitHub-generated merges
        # stamped "now", newer than every commit on the base branch.
        BASE_TIMESTAMP=$(git log --format=%ct HEAD | sort -n | head -n 1)
        git fetch --no-tags --shallow-since "${BASE_TIMESTAMP}" origin "${BASE_REF}"
        python -m towncrier.check --compare-with=origin/${BASE_REF}
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
