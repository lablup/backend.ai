name: ci

on:
  push:
    branches:
      - 'main'
      - '[0-9][0-9].[0-9]'
      - '[0-9][0-9].[0-9][0-9]'
    tags:
      - '[0-9][0-9].[0-9].*'
      - '[0-9][0-9].[0-9][0-9].*'
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:

  labeler:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: lablup/auto-labeler@main

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      models: ${{ steps.filter.outputs.models }}
      release: ${{ steps.release.outputs.release }}
      base-ref: ${{ steps.base.outputs.ref }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 2
        lfs: false
    - name: Find the revision a changed-only run compares against
      id: base
      # A PR checks out the synthetic refs/pull/N/merge commit, a merge of the PR
      # head into the current base tip, so its first parent is the base the merge was
      # built on -- whatever the PR's commit count, rebases, or merges of main back
      # into the topic branch. A push's first parent is the previous commit.
      run: echo "ref=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
    - name: Detect release PR
      id: release
      uses: ./.github/actions/detect-release-pr
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          code:
            - 'src/**'
            - 'tests/**'
            - '**/BUILD'
            - 'pants.toml'
            - 'pants.ci.toml'
            - 'python*.lock'
            - 'tools/*.lock'
            - '.github/workflows/ci*.yml'
            - '.github/actions/pants-caches/**'
            - '.github/scripts/plan-ci-targets.py'
          models:
            - 'src/ai/backend/manager/models/**'

  # A tag and a release PR check every target; anything else only what changed
  # since `base-ref`. A fork PR gets no problem-matcher annotations. Only a push to
  # a branch passes `cache-branch`, and the caches are saved only when
  # `decide-cache-save.sh` finds it at the tip of main or of a maintained version.
  check-build-and-lint:
    needs: detect-changes
    if: |
      always()
      && (
        needs.detect-changes.result != 'success'
        || needs.detect-changes.outputs.code == 'true'
        || startsWith(github.ref, 'refs/tags/')
        || needs.detect-changes.outputs.release == 'true'
      )
    uses: ./.github/workflows/ci-lint.yml
    with:
      detect-changes-result: ${{ needs.detect-changes.result }}
      base-ref: ${{ needs.detect-changes.outputs.base-ref }}
      annotate: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
      full-run: ${{ startsWith(github.ref, 'refs/tags/') || needs.detect-changes.outputs.release == 'true' }}
      cache-branch: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref_name || '' }}

  # Builds the dependents map once and hands every typecheck and test job its
  # targets in the `ci-targets` artifact, with the shards that hold a target. A
  # job with no targets is not started, so each gate below also checks this job.
  plan-targets:
    needs: detect-changes
    if: |
      always()
      && (
        needs.detect-changes.result != 'success'
        || needs.detect-changes.outputs.code == 'true'
        || startsWith(github.ref, 'refs/tags/')
        || needs.detect-changes.outputs.release == 'true'
      )
    runs-on: ubuntu-latest
    outputs:
      typecheck: ${{ steps.plan.outputs.typecheck }}
      unit-shards: ${{ steps.plan.outputs.unit-shards }}
      component-shards: ${{ steps.plan.outputs.component-shards }}
      integration-shards: ${{ steps.plan.outputs.integration-shards }}
      scenario-shards: ${{ steps.plan.outputs.scenario-shards }}
    steps:
    - name: Verify detect-changes
      if: needs.detect-changes.result != 'success'
      env:
        RESULT: ${{ needs.detect-changes.result }}
      run: |
        echo "detect-changes did not succeed: $RESULT"
        exit 1
    - name: Check out the revision with minimal required history
      uses: actions/checkout@v6
      with:
        # Depth 2 holds `base-ref`.
        fetch-depth: 2
        lfs: false
    - name: Extract Python version from pants.toml
      run: |
        PYTHON_VERSION=$(grep -m 1 -oP '(?<=CPython==)([^"]+)' pants.toml)
        echo "PANTS_CONFIG_FILES=pants.ci.toml" >> "$GITHUB_ENV"
        echo "PROJECT_PYTHON_VERSION=$PYTHON_VERSION" >> "$GITHUB_ENV"
    - name: Set up Python as Runtime
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PROJECT_PYTHON_VERSION }}
    - name: Restore the Pants caches
      uses: ./.github/actions/pants-caches
      with:
        mode: restore
    - name: Bootstrap Pants
      uses: pantsbuild/actions/init-pants@v11
      with:
        named-caches-hash: disable
        cache-lmdb-store: 'false'
    - name: Plan the targets and shards
      id: plan
      env:
        # The dependents map holds about 6.5GiB; above the limit pantsd drops it and
        # the next run of the planner builds it again.
        PANTS_PANTSD_MAX_MEMORY_USAGE: 10GiB
        BASE_REF: ${{ needs.detect-changes.outputs.base-ref }}
        FULL_RUN: ${{ startsWith(github.ref, 'refs/tags/') || needs.detect-changes.outputs.release == 'true' }}
      run: |
        flags=()
        if [ "$FULL_RUN" == "true" ]; then flags=(--full-run); fi
        .github/scripts/plan-ci-targets.py --base-ref "$BASE_REF" "${flags[@]}" \
          --out dist/ci-targets | tee -a "$GITHUB_OUTPUT"
    - name: Upload the targets
      uses: actions/upload-artifact@v5
      with:
        name: ci-targets
        path: dist/ci-targets
    - name: Upload pants log
      uses: actions/upload-artifact@v5
      with:
        name: pants.plan-targets.log
        path: .pants.d/workdir/pants.log
      if: always()  # We want the log even on failures.

  typecheck:
    needs: plan-targets
    if: needs.plan-targets.result == 'success' && needs.plan-targets.outputs.typecheck == 'true'
    uses: ./.github/workflows/ci-typecheck.yml
    with:
      targets-artifact: ci-targets
      annotate: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
      cache-branch: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref_name || '' }}

  lint-and-typecheck:
    needs: [check-build-and-lint, plan-targets, typecheck]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - run: |
        lint_result="${{ needs.check-build-and-lint.result }}"
        plan_result="${{ needs.plan-targets.result }}"
        typecheck_result="${{ needs.typecheck.result }}"
        echo "check-build-and-lint: $lint_result"
        echo "plan-targets: $plan_result"
        echo "typecheck: $typecheck_result"
        for r in "$lint_result" "$plan_result" "$typecheck_result"; do
          if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
            echo "FAIL: unexpected result $r"
            exit 1
          fi
        done
        echo "OK"

  alembic:
    needs: detect-changes
    if: |
      needs.detect-changes.result == 'success'
      && (
        (github.event_name == 'pull_request'
          && (needs.detect-changes.outputs.models == 'true' || needs.detect-changes.outputs.release == 'true'))
        || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      )
    uses: ./.github/workflows/ci-alembic.yml

  check-alembic-migrations:
    needs: [alembic]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - run: |
        r="${{ needs.alembic.result }}"
        echo "alembic: $r"
        if [ "$r" = "success" ] || [ "$r" = "skipped" ]; then
          echo "OK"
        else
          echo "FAIL"
          exit 1
        fi

  test-unit:
    needs: [detect-changes, plan-targets]
    if: needs.plan-targets.result == 'success' && needs.plan-targets.outputs.unit-shards != '[]'
    uses: ./.github/workflows/ci-test.yml
    with:
      suite: unit
      shards: ${{ needs.plan-targets.outputs.unit-shards }}
      runner: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || needs.detect-changes.outputs.release == 'true') && 'ubuntu-latest-8-cores' || 'ubuntu-latest' }}
      targets-artifact: ci-targets
      cache-branch: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref_name || '' }}

  test-scenario:
    needs: plan-targets
    if: needs.plan-targets.result == 'success' && needs.plan-targets.outputs.scenario-shards != '[]'
    uses: ./.github/workflows/ci-test-scenario.yml
    with:
      shards: ${{ needs.plan-targets.outputs.scenario-shards }}
      runner: ubuntu-latest
      targets-artifact: ci-targets
      cache-branch: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref_name || '' }}

  test-component:
    needs: [detect-changes, plan-targets]
    if: needs.plan-targets.result == 'success' && needs.plan-targets.outputs.component-shards != '[]'
    uses: ./.github/workflows/ci-test.yml
    with:
      suite: component
      shards: ${{ needs.plan-targets.outputs.component-shards }}
      runner: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || needs.detect-changes.outputs.release == 'true') && 'ubuntu-latest-8-cores' || 'ubuntu-latest' }}
      sentinel-hosts: true
      targets-artifact: ci-targets
      cache-branch: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref_name || '' }}

  test-integration:
    needs: [detect-changes, plan-targets]
    if: needs.plan-targets.result == 'success' && needs.plan-targets.outputs.integration-shards != '[]'
    uses: ./.github/workflows/ci-test.yml
    with:
      suite: integration
      shards: ${{ needs.plan-targets.outputs.integration-shards }}
      runner: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || needs.detect-changes.outputs.release == 'true') && 'ubuntu-latest-8-cores' || 'ubuntu-latest' }}
      sentinel-hosts: true
      targets-artifact: ci-targets
      cache-branch: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref_name || '' }}

  test-unit-gate:
    needs: [plan-targets, test-unit]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - run: |
        for name in plan-targets test-unit; do
          case "$name" in
            plan-targets) r="${{ needs.plan-targets.result }}" ;;
            test-unit) r="${{ needs.test-unit.result }}" ;;
          esac
          echo "$name: $r"
          if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
            echo "FAIL"
            exit 1
          fi
        done
        echo "OK"

  test-component-gate:
    needs: [plan-targets, test-component, test-scenario]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - run: |
        for name in plan-targets test-component test-scenario; do
          case "$name" in
            plan-targets) r="${{ needs.plan-targets.result }}" ;;
            test-component) r="${{ needs.test-component.result }}" ;;
            test-scenario) r="${{ needs.test-scenario.result }}" ;;
          esac
          echo "$name: $r"
          if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
            echo "FAIL"
            exit 1
          fi
        done
        echo "OK"

  test-integration-gate:
    needs: [plan-targets, test-integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - run: |
        for name in plan-targets test-integration; do
          case "$name" in
            plan-targets) r="${{ needs.plan-targets.result }}" ;;
            test-integration) r="${{ needs.test-integration.result }}" ;;
          esac
          echo "$name: $r"
          if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
            echo "FAIL"
            exit 1
          fi
        done
        echo "OK"

  determine-release-grade:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      RELEASE_AUDIENCE: ${{ steps.grade.outputs.RELEASE_AUDIENCE }}
      IS_PRERELEASE: ${{ steps.grade.outputs.IS_PRERELEASE }}
    steps:
    - name: Check out the revision
      uses: actions/checkout@v6
      with:
        lfs: false
    - name: Determine the release grade
      id: grade
      run: python3 ./scripts/determine-release-type.py "$(cat VERSION)" >> "$GITHUB_OUTPUT"

  release:
    needs: [determine-release-grade, lint-and-typecheck, test-unit-gate, test-component-gate, test-integration-gate, check-alembic-migrations]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/ci-release.yml
    with:
      tag: ${{ github.ref_name }}
      release-audience: ${{ needs.determine-release-grade.outputs.RELEASE_AUDIENCE }}
      is-prerelease: ${{ needs.determine-release-grade.outputs.IS_PRERELEASE }}
    secrets: inherit

  post-release:
    needs: [determine-release-grade, release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/ci-post-release.yml
    with:
      tag: ${{ github.ref_name }}
      release-audience: ${{ needs.determine-release-grade.outputs.RELEASE_AUDIENCE }}
    secrets: inherit

  publish-to-pypi:
    needs: [determine-release-grade, release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      && needs.determine-release-grade.outputs.RELEASE_AUDIENCE == 'public'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: deploy-to-pypi
    steps:
    - uses: actions/checkout@v6
    - name: Extract Python version from pants.toml
      run: |
        PYTHON_VERSION=$(grep -m 1 -oP '(?<=CPython==)([^"]+)' pants.toml)
        echo "PROJECT_PYTHON_VERSION=$PYTHON_VERSION" >> "$GITHUB_ENV"
    - name: Set up Python as Runtime
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PROJECT_PYTHON_VERSION }}
    - name: Install local dependencies for packaging
      run: |
        pip install -U 'twine~=6.0'
    - name: Download wheels
      uses: actions/download-artifact@v6
      with:
        name: wheels
        path: dist
    - name: mint API token
      id: mint-token
      run: |
          # retrieve the ambient OIDC token
          resp=$(curl --fail-with-body -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pypi")
          oidc_token=$(jq -r '.value' <<< "${resp}")

          # exchange the OIDC token for an API token
          resp=$(curl --fail-with-body -X POST https://pypi.org/_/oidc/mint-token -d "{\"token\": \"${oidc_token}\"}")
          api_token=$(jq -r '.token' <<< "${resp}")

          # mask the newly minted API token, so that we don't accidentally leak it
          echo "::add-mask::${api_token}"

          # see the next step in the workflow for an example of using this step output
          echo "api-token=${api_token}" >> "${GITHUB_OUTPUT}"
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ steps.mint-token.outputs.api-token }}
      # We don't use `pants publish ::` because we manually rename the
      # wheels after building them to add arch-specific tags.
      run: |
        twine upload --skip-existing dist/*.whl dist/*.tar.gz
