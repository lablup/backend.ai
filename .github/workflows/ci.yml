name: ci

# The Go checks of `v2`.

on:
  push:
    branches:
      - 'v2'
  pull_request:
    branches:
      - 'v2'

concurrency:
  # A pull request run is superseded by the next push to it; a push run to `v2`
  # runs to the end for every commit.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - name: Set up Go
        id: go
        uses: ./.github/actions/go-setup
        with:
          cache-prefix: fmt
      - name: Format
        run: go tool golangci-lint fmt
      - name: Check that formatting changed nothing
        run: git diff --exit-code
      - name: Save the Go caches
        if: github.event_name == 'push'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.go.outputs.cache-paths }}
          key: ${{ steps.go.outputs.cache-key-prefix }}${{ github.sha }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - name: Set up Go
        id: go
        uses: ./.github/actions/go-setup
        with:
          cache-prefix: lint
      - name: Lint
        run: go tool golangci-lint run
      - name: Save the Go caches
        if: github.event_name == 'push'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.go.outputs.cache-paths }}
          key: ${{ steps.go.outputs.cache-key-prefix }}${{ github.sha }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - name: Set up Go
        id: go
        uses: ./.github/actions/go-setup
        with:
          cache-prefix: build
      - name: Build
        run: go build ./...
      - name: Check the changelog fragments
        run: go run ./tools/changelog check
      - name: Tidy the module
        run: go mod tidy
      - name: Check that tidy changed nothing
        run: git diff --exit-code go.mod go.sum
      - name: Save the Go caches
        if: github.event_name == 'push'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.go.outputs.cache-paths }}
          key: ${{ steps.go.outputs.cache-key-prefix }}${{ github.sha }}

  # Not in `ci-gate` on a pull request: it reports without blocking.
  test-short:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - name: Set up Go
        id: go
        uses: ./.github/actions/go-setup
        with:
          cache-prefix: test-short
      - name: Test
        run: go test -short ./...
      - name: Save the Go caches
        if: github.event_name == 'push'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.go.outputs.cache-paths }}
          key: ${{ steps.go.outputs.cache-key-prefix }}${{ github.sha }}

  test:
    if: github.event_name == 'push'
    uses: ./.github/workflows/test.yml

  # Not in `ci-gate` on a pull request: it reports without blocking. On a push
  # a difference opens a pull request with the regenerated code.
  generate-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          # The pull request's checks only run when its branch is pushed by
          # something other than the workflow's own token.
          token: ${{ github.event_name == 'push' && secrets.OCTODOG || github.token }}
      - name: Set up Go
        id: go
        uses: ./.github/actions/go-setup
        with:
          cache-prefix: generate
      - name: Generate
        run: go generate ./...
      - name: Check that generation changed nothing
        if: github.event_name == 'pull_request'
        run: git diff --exit-code
      - name: Open a pull request with the regenerated code
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.OCTODOG }}
          COMMIT: ${{ github.sha }}
          BASE: ${{ github.ref_name }}
        run: .github/scripts/open-go-generate-pr.sh "$COMMIT" "$BASE"
      - name: Save the Go caches
        if: github.event_name == 'push'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.go.outputs.cache-paths }}
          key: ${{ steps.go.outputs.cache-key-prefix }}${{ github.sha }}

  ci-gate:
    needs: [fmt, lint, build]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: |
          for name in fmt lint build; do
            case "$name" in
              fmt) r="${{ needs.fmt.result }}" ;;
              lint) r="${{ needs.lint.result }}" ;;
              build) r="${{ needs.build.result }}" ;;
            esac
            echo "$name: $r"
            if [ "$r" != "success" ]; then
              echo "FAIL"
              exit 1
            fi
          done
          echo "OK"
