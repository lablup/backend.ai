name: alembic-freeze-check

# `main` takes no new manager alembic migration; schema changes go to the goose
# migrations on `v2`. `allow:alembic-migration` lets a bug fix through.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-new-alembic-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the revision
        uses: actions/checkout@v6
        with:
          lfs: false
          fetch-depth: 0
          filter: blob:none
      - name: Check whether a new alembic migration is added
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          status=0
          findings=$(.github/scripts/check-new-alembic-migration.sh \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --labels "$PR_LABELS") || status=$?
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            echo "::error file=${path},title=New alembic migration::main takes no new alembic migration. Add a goose migration on v2, or carry allow:alembic-migration for a bug fix that needs one."
          done <<< "$findings"
          exit $status
