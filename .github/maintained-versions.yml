# The release versions maintained by this repository.
#
# Every entry must have a release branch of the same name, and every entry
# receives the backport of a `fix:` pull request merged into `main`.
# Add a version when its release branch is created; remove it when the version
# reaches the end of its life.
#
# `lts: true` marks a long-term support line. The newest maintained version
# drives the edge installer channel, the newest LTS one the stable channel.
versions:
  - version: "26.8"
  - version: "26.4"
    lts: true
